/* ══ 9 · FRIDAY EXECUTIVE REPORT ═══════════════════════════════════
   Composed from the week's data, then edited. The narrative fields are
   the only thing typed; every figure comes from the other views.     */
let RPT = null;   // the report being edited

function reportPeriod(dateStr) {
  let d = parse(dateStr) || new Date();
  // a report dated outside the wave reads as an error — pull it to the
  // nearest real project week instead
  const lo = parse(weekEnd(1)), hi = parse(weekEnd(D.meta.weeks));
  if (d < lo) d = lo; else if (d > hi) d = hi;
  const dow = (d.getDay() + 6) % 7;                 // Mon = 0
  const fri = new Date(d); fri.setDate(d.getDate() + (4 - dow));
  const mon = new Date(fri); mon.setDate(fri.getDate() - 4);
  return { from: iso(mon), to: iso(fri) };
}

/** everything that changed inside the reporting week */
function weekFacts(from, to) {
  const inWk = t => { const d = iso(new Date(t)); return d >= from && d <= to; };
  // before the wave starts, or after it ends, report against the nearest real week
  const wk = clamp(weekOf(to) || 1, 1, D.meta.weeks);
  const items = allWork();
  const ms = D.milestones.slice().sort((a, b) => a.week - b.week);
  return {
    wk,
    progress: overallProgress(),
    updates: D.updates.filter(u => inWk(u.ts)).sort((a, b) => a.ts - b.ts),
    milestonesDue: ms.filter(m => m.week === wk),
    milestonesMet: ms.filter(m => m.status === 'done'),
    milestonesNext: ms.filter(m => m.status !== 'done').slice(0, 3),
    milestonesLate: ms.filter(m => m.status !== 'done' && m.week < wk),
    blocked: items.filter(w => w.status === 'blocked'),
    inflight: items.filter(w => w.status === 'progress' || w.status === 'review'),
    dueNext: items.filter(w => w.status !== 'done' && w.due > to && w.due <= addDays(to, 7)),
    overdue: items.filter(w => w.status !== 'done' && w.due < from),
    risksOpen: D.risks.filter(r => r.status === 'open'),
    risksHigh: D.risks.filter(r => r.status === 'open' && r.sev === 'H'),
    sessionsHeld: D.events.filter(e => e.date >= from && e.date <= to),
    sessionsNext: D.events.filter(e => e.date > to && e.date <= addDays(to, 7))
      .sort((a, b) => a.date.localeCompare(b.date)),
    meetings: D.pilotLogs.flatMap(l => (l.meetings || []).filter(m => m.date >= from && m.date <= to)
      .map(m => ({ ...m, pilot: l.id }))),
    results: D.pilotLogs.flatMap(l => (l.results || []).filter(m => m.date >= from && m.date <= to)
      .map(m => ({ ...m, pilot: l.id }))),
    learnings: D.pilotLogs.flatMap(l => (l.learnings || []).filter(m => m.date >= from && m.date <= to)
      .map(m => ({ ...m, pilot: l.id }))),
  };
}

/** the draft narrative — a starting point the lead rewrites */
function composeNarrative(f) {
  const P = f.progress;
  const bits = [];
  bits.push(`Wave 1 is in week ${f.wk} of ${D.meta.weeks}. ${P.done} of ${P.total} pilot activities are complete (${P.pct}%), with ${f.inflight.length} in flight across ${D.pilots.length} pilots.`);
  if (f.milestonesMet.length) bits.push(`${f.milestonesMet.length} of ${D.milestones.length} wave milestones have been met.`);
  if (f.milestonesDue.length) bits.push(`Due this week: ${f.milestonesDue.map(m => m.id + ' ' + m.name).join('; ')}.`);
  if (f.milestonesLate.length) bits.push(`${f.milestonesLate.length} milestone${f.milestonesLate.length === 1 ? ' is' : 's are'} past their planned week and need re-baselining.`);
  if (f.sessionsHeld.length) bits.push(`${f.sessionsHeld.length} sessions were held this week${f.meetings.length ? `, with ${f.meetings.length} pilot meeting${f.meetings.length === 1 ? '' : 's'} minuted` : ''}.`);
  if (f.results.length) bits.push(`${f.results.length} pilot result${f.results.length === 1 ? ' was' : 's were'} recorded.`);
  if (f.blocked.length) bits.push(`${f.blocked.length} activit${f.blocked.length === 1 ? 'y is' : 'ies are'} blocked and need${f.blocked.length === 1 ? 's' : ''} attention.`);
  if (f.risksHigh.length) bits.push(`${f.risksHigh.length} high-severity risk${f.risksHigh.length === 1 ? ' remains' : 's remain'} open.`);
  return bits.join(' ');
}

function newReport(dateStr) {
  const { from, to } = reportPeriod(dateStr || todayISO());
  const f = weekFacts(from, to);
  return {
    id: uid('RPT'), from, to, week: f.wk, created: Date.now(),
    rag: D.meta.overallRag, author: D.meta.deliveryLead,
    headline: composeNarrative(f),
    achievements: f.updates.filter(u => u.kind === 'g').map(u => u.what).join('\n') ||
      f.results.map(r => `${r.pilot}: ${r.title}${r.metric ? ' — ' + r.metric : ''}`).join('\n'),
    nextWeek: f.sessionsNext.slice(0, 8).map(e => `${fmtD(e.date)} — ${e.title}`).join('\n'),
    decisions: '', asks: '',
  };
}

/* ── export helpers ─────────────────────────────────────────────── */
const csvCell = v => {
  const s = v === null || v === undefined ? '' : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};
const toCSV = (head, rows) => [head.map(csvCell).join(','), ...rows.map(r => r.map(csvCell).join(','))].join('\r\n');

function boardCSV() {
  return toCSV(['Pilot', 'Pilot name', 'Activity', 'Phase', 'Title', 'Accountable role', 'Status',
    'Owner', 'Due', 'Percent', 'Start week', 'End week', 'Gate', 'Expected output', 'Blocker', 'Notes'],
    allWork().map(w => {
      const p = D.pilots.find(x => x.id === w.pilot) || {};
      return [w.pilot, p.name || '', w.act, w.phase, w.title, w.role,
        (STATUSES.find(s => s.k === w.status) || {}).t || w.status, w.owner, w.due, w.pct,
        w.startWk, w.endWk, w.gate, w.output, w.blocker, (w.notes || '').replace(/\s+/g, ' ')];
    }));
}

let capCache = {};
async function cap(name) {
  if (name in capCache) return capCache[name];
  let v = null;
  try { v = await window.claude?.use?.(name); } catch (_) { v = null; }
  capCache[name] = v; return v;
}
async function saveFile(filename, text) {
  const dl = await cap('downloads');
  if (dl) {
    try { await dl.save({ filename, data: text }); flash('Saved ' + filename); return; }
    catch (err) {
      const c = err && err.code;
      if (c === 'declined' || c === 'rate_limited') return;
      console.warn('save', c || err);
    }
  }
  const w = window.open('', '_blank');
  if (w) {
    w.document.write('<title>' + esc(filename) + '</title><pre style="white-space:pre-wrap;font:12px ui-monospace,monospace;padding:16px">' + esc(text) + '</pre>');
    w.document.close();
  } else flash('Downloads are blocked in this view — open the page in its own tab.', 'warn');
}

function importJson() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      let d;
      try { d = JSON.parse(r.result); }
      catch (_) { flash('That file is not valid JSON.', 'warn'); return; }
      if (!d || !Array.isArray(d.pilots)) { flash('That does not look like a command center backup.', 'warn'); return; }
      if (!confirm('Replace everything currently held with this file?')) return;
      replaceModel({ ...freshData(), ...d, meta: { ...SEED.meta, ...(d.meta || {}) } });
      flash('Imported.');
      paint();
    };
    r.readAsText(f);
  };
  inp.click();
}

/** write the whole in-memory model out to whichever backend is active */
function pushAll() {
  if (Store.mode === 'api') { Store.queueAll(); return; }
  if (Store.mode === 'db' && Store.db) {
    Store.db.doc('config/meta').set(D.meta).catch(() => {});
    Store.db.doc('config/activityTemplate').set({ list: D.activityTemplate }).catch(() => {});
    for (const c of COLL) for (const r of (D[c] || [])) Store.db.doc(c + '/' + r.id).set(r).catch(() => {});
  } else Store.saveLocalNow();
}
/** swap the whole model for another one, deleting shared records the new one lacks */
function replaceModel(next) {
  const old = COLL.flatMap(c => (D[c] || []).map(r => ({ coll: c, id: r.id })));
  D = next;
  for (const k of old) if (!(D[k.coll] || []).some(r => r.id === k.id)) Store.remove(k.coll, k.id);
  pushAll();
}
/* ══ ROUTER ════════════════════════════════════════════════════════ */
const TABS = ['exec', 'backlog', 'timeline', 'calendar', 'pilots', 'deliv', 'change', 'risks', 'report', 'data'];

  for (const t of TABS) {
    const on = TAB === t;
    const b = document.getElementById('tab-' + t), p = document.getElementById('panel-' + t);
    if (b) b.setAttribute('aria-selected', String(on));

  const wk = currentWeek();
  $('#weekTxt').textContent = `Week ${wk} of ${D.meta.weeks}`;
  $('#ragTxt').textContent = 'Status ' + ragOf(D.meta.overallRag);
  const rp = $('#ragPill');

  $('#projTitle').textContent = D.meta.projectName.length > 52
    ? 'Wave 1 Command Center' : D.meta.projectName;
  $('#cnt-backlog').textContent = allWork().filter(w => w.status !== 'done').length;
  $('#cnt-pilots').textContent = D.pilots.length;
  $('#cnt-risks').textContent = D.risks.filter(r => r.status === 'open').length;

  ({ exec: renderExec, backlog: renderBacklog, timeline: renderTimeline, calendar: renderCalendar,

  if (Store.mode !== 'db') Store.saveLocal();
}

/* ══ EVENTS ════════════════════════════════════════════════════════ */
document.addEventListener('click', e => {
  const t = e.target.closest('button, tr[data-openpilot], tr[data-opendeliv], [data-card], [data-openev], [data-openms], .sessrow-p');
  if (!t) return;

  if (t.classList.contains('tab')) { go(t.dataset.t); return; }
  if (t.dataset.go) { go(t.dataset.go); return; }
  if (t.id === 'drawerClose') { closeDrawer(); return; }

  /* — backlog — */
  if (t.dataset.card) { openCard(t.dataset.card); return; }
  if (t.id === 'clearF') { F.pilot = F.phase = F.owner = F.q = ''; paint(); return; }
  if (t.id === 'addWork') {
    const p = F.pilot || (D.pilots[0] && D.pilots[0].id);
    const nid = 'X' + String(D.activityTemplate.length + 1).padStart(3, '0');
    const a = { id: nid, phase: F.phase || PHASES[0], title: 'New activity', role: '',
      startWk: currentWeek(), endWk: currentWeek(), output: '', gate: '' };
    D.activityTemplate.push(a); Store.saveTemplate();
    logUpdate('Activity added to the plan', a.title, 'b', nid);
    paint(); openCard(p + '-' + nid); return;
  }

  /* — timeline — */
  if (t.dataset.tl) { TLMode = t.dataset.tl; paint(); return; }
  if (t.dataset.openms) { openMilestone(t.dataset.openms); return; }
  if (t.dataset.msrag) {
    const m = D.milestones.find(x => x.id === t.dataset.msrag); if (!m) return;
    m.rag = m.rag === t.dataset.v ? 'N' : t.dataset.v;
    Store.save('milestones', m);
    logUpdate(`Milestone ${m.id} set to ${ragOf(m.rag)}`, m.name, m.rag === 'R' ? 'r' : m.rag === 'A' ? 'a' : 'g', m.id);
    paint(); return;
  }

  /* — calendar — */
  if (t.id === 'calPrev') { CalCur = new Date(CalCur.getFullYear(), CalCur.getMonth() - 1, 1); paint(); return; }
  if (t.id === 'calNext') { CalCur = new Date(CalCur.getFullYear(), CalCur.getMonth() + 1, 1); paint(); return; }
  if (t.id === 'calToday') { CalCur = null; paint(); return; }
  if (t.dataset.openev) { openEvent(t.dataset.openev); return; }
  if (t.id === 'addEvent') {
    const ev = { id: uid('EV'), date: todayISO(), start: '09:00', end: '10:00',
      title: 'New session', owner: '', cat: 'gov', pilot: '', notes: '', done: false };
    D.events.push(ev); Store.save('events', ev); paint(); openEvent(ev.id); return;
  }
  if (t.dataset.delev) {
    if (!confirm('Delete this session?')) return;
    D.events = D.events.filter(x => x.id !== t.dataset.delev);
    Store.remove('events', t.dataset.delev); closeDrawer(); paint(); return;
  }

  /* — pilots — */
  if (t.dataset.selpilot) { selPilot = t.dataset.selpilot; paint(); return; }
  if (t.dataset.openpilot) { openPilot(t.dataset.openpilot); return; }
  if (t.dataset.ptab) { pilotTab = t.dataset.ptab; paint(); return; }
  if (t.dataset.prag) {
    const p = D.pilots.find(x => x.id === t.dataset.prag); if (!p) return;
    const was = p.rag;
    p.rag = p.rag === t.dataset.v ? 'N' : t.dataset.v;
    Store.save('pilots', p);
    if (was !== p.rag) logUpdate(`${p.short} set to ${ragOf(p.rag)}`,
      p.summary || p.nextStep || '', p.rag === 'R' ? 'r' : p.rag === 'A' ? 'a' : 'g', p.id);
    paint(); return;
  }
  if (t.dataset.sc) {
    const p = D.pilots.find(x => x.id === t.dataset.sc); if (!p) return;
    const c = p.successCriteria[+t.dataset.sci]; c.met = !c.met;
    Store.save('pilots', p);
    if (c.met) logUpdate(`${p.short} met a success criterion`, c.t, 'g', p.id);
    paint(); return;
  }
  if (t.dataset.addsc) {
    const p = D.pilots.find(x => x.id === t.dataset.addsc); if (!p) return;
    p.successCriteria.push({ t: '', met: false }); Store.save('pilots', p); paint(); return;
  }
  if (t.dataset.addlog) {
    const which = t.dataset.addlog, l = pilotLog(selPilot);
    const row = { id: uid('L'), date: todayISO(), title: '' };
    l[which].unshift(row); Store.save('pilotLogs', l);
    const p = D.pilots.find(x => x.id === selPilot);
    logUpdate(`${p ? p.short : selPilot} — ${which.slice(0, -1)} recorded`, '',
      which === 'results' ? 'g' : which === 'learnings' ? 'a' : 'b', selPilot);
    paint(); return;
  }
  if (t.dataset.dellog) {
    const which = t.dataset.dellog, l = pilotLog(selPilot);
    l[which] = l[which].filter(x => x.id !== t.dataset.logid);
    Store.save('pilotLogs', l); paint(); return;
  }

  /* — deliverables — */
  if (t.dataset.drag) {
    const d = D.deliverables.find(x => x.id === t.dataset.drag); if (!d) return;
    const was = d.rag;
    d.rag = d.rag === t.dataset.v ? 'N' : t.dataset.v;
    Store.save('deliverables', d);
    if (was !== d.rag) logUpdate(`${d.id} set to ${ragOf(d.rag)}`, d.name,
      d.rag === 'R' ? 'r' : d.rag === 'A' ? 'a' : 'g', d.id);
    paint(); return;
  }
  if (t.dataset.opendeliv) { openDeliv(); return; }

  /* — change — */
  if (t.dataset.chgtab) { chgTab = t.dataset.chgtab; paint(); return; }
  if (t.dataset.crag) {
    const c = D.changeStreams.find(x => x.id === t.dataset.crag); if (!c) return;
    c.rag = c.rag === t.dataset.v ? 'N' : t.dataset.v; Store.save('changeStreams', c); paint(); return;
  }
  if (t.dataset.krag) {
    const k = D.kpis.find(x => x.id === t.dataset.krag); if (!k) return;
    k.rag = k.rag === t.dataset.v ? 'N' : t.dataset.v; Store.save('kpis', k); paint(); return;
  }
  if (t.id === 'addStake') {
    const s = { id: uid('S'), group: 'New group', level: 'Informed', who: '', cadence: '', owner: '', ask: '' };
    D.stakeholders.push(s); Store.save('stakeholders', s); paint(); return;
  }
  if (t.dataset.delstake) {
    D.stakeholders = D.stakeholders.filter(x => x.id !== t.dataset.delstake);
    Store.remove('stakeholders', t.dataset.delstake); paint(); return;
  }

  /* — risks — */
  if (t.id === 'addRisk') {
    const r = { id: uid('R'), sev: 'M', type: 'Delivery', name: 'New risk', desc: '', mitigation: '',
      owner: '', status: 'open', pilot: '', due: '', raised: todayISO() };
    D.risks.push(r); Store.save('risks', r);
    logUpdate('Risk raised', r.name, 'a', r.id); paint(); return;
  }
  if (t.dataset.delrisk) {
    if (!confirm('Remove this risk from the register?')) return;
    D.risks = D.risks.filter(x => x.id !== t.dataset.delrisk);
    Store.remove('risks', t.dataset.delrisk); paint(); return;
  }

  /* — executive — */
  if (t.dataset.setrag) {
    const was = D.meta.overallRag;
    D.meta.overallRag = t.dataset.setrag; Store.saveMeta();
    if (was !== D.meta.overallRag) logUpdate(`Wave status set to ${ragOf(D.meta.overallRag)}`,
      D.meta.ragNote || '', D.meta.overallRag === 'R' ? 'r' : D.meta.overallRag === 'A' ? 'a' : 'g');
    paint(); return;
  }

  /* — report — */
  if (t.dataset.rrag) { RPT.rag = t.dataset.rrag; paint(); return; }
  if (t.id === 'rptRecompose') {
    const keep = { decisions: RPT.decisions, asks: RPT.asks, author: RPT.author, rag: RPT.rag };
    RPT = { ...newReport(RPT.to), ...keep, id: RPT.id };
    flash('Re-composed from the current data.'); paint(); return;
  }
  if (t.id === 'rptSave') {
    const i = D.reports.findIndex(r => r.id === RPT.id);
    if (i >= 0) D.reports[i] = { ...RPT }; else D.reports.push({ ...RPT });
    Store.save('reports', RPT);
    logUpdate('Weekly report saved', 'Week ending ' + fmtD(RPT.to), 'b', 'W' + RPT.week);
    flash('Report saved.'); paint(); return;
  }
  if (t.id === 'rptPrint') { window.print(); return; }
  if (t.dataset.loadrpt) {
    const r = D.reports.find(x => x.id === t.dataset.loadrpt);
    if (r) { RPT = { ...r }; paint(); } return;
  }
  if (t.dataset.delrpt) {
    if (!confirm('Delete this saved report?')) return;
    D.reports = D.reports.filter(x => x.id !== t.dataset.delrpt);
    Store.remove('reports', t.dataset.delrpt); paint(); return;
  }

  /* — data & setup — */
  if (t.id === 'expJson') {
    saveFile(`Wave1_CommandCenter_${todayISO()}.json`, JSON.stringify(D, null, 2)); return;
  }
  if (t.id === 'expCsv') { saveFile(`Wave1_Board_${todayISO()}.csv`, boardCSV()); return; }
  if (t.id === 'impJson') { importJson(); return; }
  if (t.id === 'resetProgress') {
    if (!confirm('Clear every status, owner, log entry and report? The plan itself is kept.')) return;
    for (const c of ['work', 'updates', 'reports', 'pilotLogs']) {
      for (const r of (D[c] || [])) Store.remove(c, r.id);
      D[c] = [];
    }
    D.pilots.forEach(p => { p.rag = 'N'; p.summary = ''; p.nextStep = ''; p.blockers = '';
      p.phase = PHASES[0]; p.successCriteria.forEach(c => c.met = false); Store.save('pilots', p); });
    D.milestones.forEach(m => { m.status = 'planned'; m.rag = 'N'; m.date = ''; m.evidence = ''; Store.save('milestones', m); });
    D.deliverables.forEach(d => { d.status = 'not-started'; d.pct = 0; d.rag = 'N'; d.evidence = ''; Store.save('deliverables', d); });
    D.changeStreams.forEach(c => { c.pct = 0; c.rag = 'N'; Store.save('changeStreams', c); });
    D.meta.overallRag = 'N'; D.meta.ragNote = ''; Store.saveMeta();
    RPT = null; flash('Progress cleared.'); paint(); return;
  }
  if (t.id === 'resetAll') {
    if (!confirm('Reset everything to the seeded Wave 1 plan? All your data is lost.')) return;
    if (!confirm('Last check — export a backup first if you might want it back.')) return;
    replaceModel(freshData()); RPT = null; flash('Reset to the seeded plan.'); paint(); return;
  }
});

  if (el.dataset.ms && el.dataset.msf) { writeRec('milestones', el.dataset.ms, el.dataset.msf, el, true); return; }
  if (el.dataset.d && el.dataset.df) { writeRec('deliverables', el.dataset.d, el.dataset.df, el, true); return; }
  if (el.dataset.p && el.dataset.pf) { writeRec('pilots', el.dataset.p, el.dataset.pf, el, true); return; }
  if (el.dataset.r && el.dataset.rf) { writeRec('risks', el.dataset.r, el.dataset.rf, el, true); return; }
  if (el.dataset.c && el.dataset.cf) { writeRec('changeStreams', el.dataset.c, el.dataset.cf, el, true); return; }
  if (el.dataset.k && el.dataset.kf) { writeRec('kpis', el.dataset.k, el.dataset.kf, el, true); return; }
  if (el.dataset.t && el.dataset.tf) { writeRec('training', el.dataset.t, el.dataset.tf, el, true); return; }
  if (el.dataset.s && el.dataset.sf) { writeRec('stakeholders', el.dataset.s, el.dataset.sf, el, true); return; }

});

/* ── input (text, textarea, range) — no repaint, so focus is kept ── */
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'fq') { F.q = el.value; repaintBoardOnly(); return; }
  if (el.dataset.rpt) { RPT[el.dataset.rpt] = el.value; return; }
  if (el.dataset.w && el.dataset.wf) { writeWork(el, false); return; }
  if (el.dataset.log && el.dataset.logid) {
    const l = pilotLog(selPilot), row = (l[el.dataset.log] || []).find(x => x.id === el.dataset.logid);
    if (row) { row[el.dataset.logf] = el.value; Store.save('pilotLogs', l); }
    return;
  }
  if (el.dataset.scx) {
    const p = D.pilots.find(x => x.id === el.dataset.scx);
    if (p) { p.successCriteria[+el.dataset.sci].t = el.value; Store.save('pilots', p); }
    return;
  }
  if (el.dataset.ev && el.dataset.evf) { writeRec('events', el.dataset.ev, el.dataset.evf, el, false); return; }
  if (el.dataset.ms && el.dataset.msf) { writeRec('milestones', el.dataset.ms, el.dataset.msf, el, false); return; }
  if (el.dataset.d && el.dataset.df) { writeRec('deliverables', el.dataset.d, el.dataset.df, el, el.type === 'range'); return; }
  if (el.dataset.p && el.dataset.pf) { writeRec('pilots', el.dataset.p, el.dataset.pf, el, false); return; }
  if (el.dataset.r && el.dataset.rf) { writeRec('risks', el.dataset.r, el.dataset.rf, el, false); return; }
  if (el.dataset.c && el.dataset.cf) { writeRec('changeStreams', el.dataset.c, el.dataset.cf, el, el.type === 'range'); return; }
  if (el.dataset.k && el.dataset.kf) { writeRec('kpis', el.dataset.k, el.dataset.kf, el, false); return; }
  if (el.dataset.t && el.dataset.tf) { writeRec('training', el.dataset.t, el.dataset.tf, el, false); return; }
  if (el.dataset.s && el.dataset.sf) { writeRec('stakeholders', el.dataset.s, el.dataset.sf, el, false); return; }
  if (el.dataset.meta) { writeMeta(el, false); return; }
});

const NUMF = new Set(['week', 'weeks', 'dueWeek', 'pct', 'startWk', 'endWk', 'startWeek', 'endWeek']);
function coerce(field, el) {
  if (el.type === 'number' || el.type === 'range' || NUMF.has(field)) return +el.value || 0;
  if (field === 'done') return el.value === 'true';
  return el.value;
}
function writeRec(coll, id, field, el, repaint) {
  const rec = (D[coll] || []).find(x => x.id === id);
  if (!rec) return;
  rec[field] = coerce(field, el);
  Store.save(coll, rec);
  if (coll === 'deliverables' && field === 'pct') {
    const lab = el.closest('div').querySelector('.lbl');
    if (lab) lab.textContent = 'Completion — ' + rec.pct + '%';
  }
  if (repaint) paint(); else if (Store.mode !== 'db') Store.saveLocal();
}
function writeWork(el, repaint) {
  const id = el.dataset.w, field = el.dataset.wf;
  const before = getWork(id);
  const patch = {}; patch[field] = coerce(field, el);
  if (field === 'status' && patch.status === 'done') patch.pct = 100;
  setWork(id, patch);
  if (field === 'status' && before && before.status !== patch.status) {
    const p = D.pilots.find(x => x.id === before.pilot);
    logUpdate(`${p ? p.short : before.pilot} · ${before.act} → ${(STATUSES.find(s => s.k === patch.status) || {}).t}`,
      before.title, patch.status === 'done' ? 'g' : patch.status === 'blocked' ? 'r' : 'b', before.act);
  }
  if (repaint) paint(); else if (Store.mode !== 'db') Store.saveLocal();
}
function writeMeta(el, repaint) {
  const f = el.dataset.meta;
  D.meta[f] = (f === 'weeks') ? clamp(+el.value || 1, 1, 52) : el.value;
  Store.saveMeta();
  if (repaint) paint(); else if (Store.mode !== 'db') Store.saveLocal();
}

/** the search box repaints only the board, so typing keeps focus */
function repaintBoardOnly() {
  const q = $('#fq'), pos = q && q.selectionStart;
  renderBacklog();
  const again = $('#fq');
  if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (_) {} }
}

/* ── drag and drop on the board ─────────────────────────────────── */
let dragId = null;
document.addEventListener('dragstart', e => {
  const c = e.target.closest('.kcard'); if (!c) return;
  dragId = c.dataset.card; c.classList.add('drag');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', dragId); } catch (_) {}
});
document.addEventListener('dragend', e => {
  const c = e.target.closest('.kcard'); if (c) c.classList.remove('drag');
  $$('.kcol.over').forEach(x => x.classList.remove('over'));
  dragId = null;
});
document.addEventListener('dragover', e => {
  const list = e.target.closest('[data-drop]'); if (!list || !dragId) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  $$('.kcol.over').forEach(x => x.classList.remove('over'));
  list.closest('.kcol').classList.add('over');
});
document.addEventListener('drop', e => {
  const list = e.target.closest('[data-drop]'); if (!list || !dragId) return;
  e.preventDefault();
  const status = list.dataset.drop, id = dragId, before = getWork(id);
  if (before && before.status !== status) {
    const patch = { status };
    if (status === 'done') patch.pct = 100;
    setWork(id, patch);
    const p = D.pilots.find(x => x.id === before.pilot);
    logUpdate(`${p ? p.short : before.pilot} · ${before.act} → ${(STATUSES.find(s => s.k === status) || {}).t}`,
      before.title, status === 'done' ? 'g' : status === 'blocked' ? 'r' : 'b', before.act);
  }
  dragId = null; paint();
});

document.addEventListener('keydown', e => {

/* ══ SIGN-IN ═══════════════════════════════════════════════════════
   Accounts are invitation-only and restricted to the client and supplier
   domains. The session token lives in this browser; every API call
   carries it, and the server re-checks the account on each request.  */
const Auth = {
  token: '', user: null, domains: [], fresh: false, mode: 'signin', resolve: null,
  load() { try { this.token = localStorage.getItem('cc.session') || ''; } catch (_) {} },
  set(token, user) {
    this.token = token; this.user = user;
    try { localStorage.setItem('cc.session', token); } catch (_) {}
    this.paintPill();
  },
  signOut() {
    try { localStorage.removeItem('cc.session'); } catch (_) {}
    location.reload();
  },
  async call(action, body) {
    const r = await fetch('/api/auth?action=' + action, {
      method: body ? 'POST' : 'GET', headers: Store.headers(), cache: 'no-store',
      body: body ? JSON.stringify(body) : undefined });
    let j = {};
    try { j = await r.json(); } catch (_) {}
    if (!r.ok) throw Object.assign(new Error(j.error || ('HTTP ' + r.status)), { status: r.status });
    return j;
  },
  paintPill() {
    const p = $('#userPill'), t = $('#userTxt');
    if (!p) return;
    p.hidden = !this.user;
    if (this.user) t.textContent = this.user.name || this.user.email;
  },
  /** show the sign-in screen; resolves once a session exists */
  show(message) {
    return new Promise(async resolve => {
      this.resolve = resolve;
      try { const d = await this.call('domains'); this.domains = d.domains || []; this.fresh = !!d.fresh; } catch (_) {}
      this.mode = this.fresh ? 'register' : 'signin';
      this.render(message || '');
      $('#auth').hidden = false;
      const first = $('#auth input'); if (first) first.focus();
    });
  },
  render(err) {
    const doms = this.domains.map(d => '@' + d).join(' or ') || 'your work';
    const reg = this.mode === 'register';
    $('#auth').innerHTML = `<form class="auth-card" id="authForm" autocomplete="on">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px">
        <div class="mark">O!</div>
        <div><div class="eyebrow">OwnIT! Digital Products</div>
          <h2 style="font-size:17px">Wave 1 Command Center</h2></div>
      </div>
      ${this.fresh ? `<div class="note info" style="margin-bottom:14px"><strong>No accounts yet.</strong>
        The first account created becomes the administrator, who then invites everyone else.</div>` : ''}
      <div class="stack" style="gap:10px">
        ${reg ? `<div><span class="lbl">Your name</span><input type="text" name="name" autocomplete="name" required></div>` : ''}
        <div><span class="lbl">Work email — ${esc(doms)}</span>
          <input type="email" name="email" autocomplete="username" required placeholder="name@${esc(this.domains[0] || 'company.com')}"></div>
        ${reg && !this.fresh ? `<div><span class="lbl">Invite code — from the project administrator</span>
          <input type="text" name="invite" autocomplete="off" required style="font-family:var(--mono);text-transform:uppercase"></div>` : ''}
        <div><span class="lbl">${reg ? 'Choose a password — at least 10 characters' : 'Password'}</span>
          <input type="password" name="password" autocomplete="${reg ? 'new-password' : 'current-password'}" required minlength="${reg ? 10 : 1}"></div>
        <div class="auth-err" id="authErr" ${err ? '' : 'hidden'}>${esc(err)}</div>
        <button class="btn primary" type="submit" id="authGo" style="padding:9px 14px;font-size:13.5px">
          ${reg ? 'Create account' : 'Sign in'}</button>
        ${this.fresh ? '' : `<button class="btn ghost sm" type="button" id="authSwap">
          ${reg ? 'Already have an account? Sign in' : 'First time here? Use your invite code'}</button>`}
      </div>
      <p class="src" style="margin:16px 0 0">Access is by invitation, for ${esc(doms)} addresses only.
        Ask the project administrator if you need an account.</p>
    </form>`;
  },
  async submit(form) {
    const f = Object.fromEntries(new FormData(form).entries());
    const go = $('#authGo'); go.disabled = true;
    try {
      const j = this.mode === 'register'
        ? await this.call('register', { email: f.email, name: f.name, password: f.password, invite: f.invite || '' })
        : await this.call('login', { email: f.email, password: f.password });
      this.set(j.token, j.user);
      $('#auth').hidden = true;
      if (this.resolve) { const r = this.resolve; this.resolve = null; r(); }
    } catch (e) {
      const el = $('#authErr'); el.textContent = e.message; el.hidden = false; go.disabled = false;
    }
  },
};
Auth.load();
document.addEventListener('submit', e => {
  if (e.target.id === 'authForm') { e.preventDefault(); Auth.submit(e.target); }
});
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'authSwap') { Auth.mode = Auth.mode === 'signin' ? 'register' : 'signin'; Auth.render(''); $('#auth input').focus(); return; }
  if (t.id === 'signOut') { Auth.signOut(); return; }
  if (t.id === 'pwBtn') {
    const cur = $('#pwCur').value, next = $('#pwNew').value;
    t.disabled = true;
    Auth.call('change-password', { current: cur, next }).then(() => { flash('Password changed.'); $('#pwCur').value = $('#pwNew').value = ''; })
      .catch(err => flash(err.message, 'warn')).finally(() => { t.disabled = false; });
    return;
  }
  if (t.id === 'invBtn') {
    const email = $('#invEmail').value.trim(), name = $('#invName').value.trim();
    if (!email) return;
    t.disabled = true;
    Auth.call('invite', { email, name }).then(j => {
      flash(`Invite code for ${j.email}: ${j.invite}`); $('#invEmail').value = $('#invName').value = ''; loadPeople();
    }).catch(err => flash(err.message, 'warn')).finally(() => { t.disabled = false; });
    return;
  }
  if (t.dataset.uact) {
    const email = t.dataset.uemail, act = t.dataset.uact;
    if (act === 'remove' && !confirm(`Remove ${email}?`)) return;
    const body = act === 'disable' ? { email, status: 'disabled' } : act === 'enable' ? { email, status: 'active' }
      : act === 'admin' ? { email, role: 'admin' } : act === 'member' ? { email, role: 'member' } : { email };
    Auth.call(act === 'remove' ? 'remove' : 'update', body).then(loadPeople).catch(err => flash(err.message, 'warn'));
    return;
  }
  if (t.dataset.copyinv) {
    navigator.clipboard?.writeText(t.dataset.copyinv).then(() => flash('Code copied.'), () => {});
  }
});

/** the People card on Data & setup — admins only, loaded on demand */
async function loadPeople() {
  const el = $('#peopleCard'); if (!el) return;
  let users = [];
  try { users = (await Auth.call('users')).users; }
  catch (e) { el.innerHTML = `<div class="body"><p class="src" style="margin:0">${esc(e.message)}</p></div>`; return; }
  const doms = Auth.domains.map(d => '@' + d).join(' or ');
  el.innerHTML = `<header><h2>People</h2><span class="hint">${users.filter(u => u.status === 'active').length} active · ${users.filter(u => u.status === 'invited').length} invited</span></header>
    <div class="body">
      <div class="row" style="align-items:flex-end;margin-bottom:12px">
        <div style="flex:1;min-width:200px"><span class="lbl">Invite by email${doms ? ' — ' + esc(doms) : ''}</span>
          <input type="email" id="invEmail" placeholder="name@avangrid.com"></div>
        <div style="flex:1;min-width:150px"><span class="lbl">Name (optional)</span><input type="text" id="invName"></div>
        <button class="btn primary" id="invBtn">Create invite</button>
      </div>
      <p class="src" style="margin:0 0 12px">Send the person their code by Teams or email; they use it with their work address to set a password.
        Codes are shown here until used.</p>
      <div class="tscroll"><table><thead><tr><th>Person</th><th>Role</th><th>Status</th><th>Last sign-in</th><th></th></tr></thead>
        <tbody>${users.map(u => `<tr>
          <td><div style="font-weight:600">${esc(u.name || '—')}</div><div class="src mono">${esc(u.email)}</div></td>
          <td><span class="badge ${u.role === 'admin' ? 'b-v' : 'b-n'}">${esc(u.role)}</span></td>
          <td>${u.status === 'invited' ? `<span class="badge b-a">Invited</span> <span class="mono" style="font-size:11px">${esc(u.invite || '')}</span>
              <button class="btn ghost sm" data-copyinv="${esc(u.invite || '')}">Copy</button>`
            : `<span class="badge ${u.status === 'active' ? 'b-g' : 'b-r'}">${esc(u.status)}</span>`}</td>
          <td class="src mono">${u.lastLogin ? esc(fmtTs(u.lastLogin)) : '—'}</td>
          <td style="white-space:nowrap">${u.email === (Auth.user && Auth.user.email) ? '<span class="src">you</span>' : `
            ${u.status === 'active' ? `<button class="btn sm" data-uact="disable" data-uemail="${esc(u.email)}">Disable</button>` : ''}
            ${u.status === 'disabled' ? `<button class="btn sm" data-uact="enable" data-uemail="${esc(u.email)}">Enable</button>` : ''}
            ${u.status !== 'invited' ? (u.role === 'admin'
              ? `<button class="btn sm" data-uact="member" data-uemail="${esc(u.email)}">Make member</button>`
              : `<button class="btn sm" data-uact="admin" data-uemail="${esc(u.email)}">Make admin</button>`) : ''}
            <button class="btn ghost sm" data-uact="remove" data-uemail="${esc(u.email)}">Remove</button>`}</td>
        </tr>`).join('')}</tbody></table></div>
    </div>`;
}

(async () => {
  const seeded = await Store.init();
  const pill = $('#syncPill'), txt = $('#syncTxt');
  if (Store.mode === 'db' || Store.mode === 'api') { pill.classList.add('live'); txt.textContent = 'Shared · saved live'; }
  else if (Store.mode === 'local') { pill.classList.add('warn'); txt.textContent = 'Saved on this computer'; }
  else { txt.textContent = 'Not saved — export before closing'; }
  if (Store.apiError) flash('Shared database unavailable (' + Store.apiError + ') — working in this browser only.', 'warn');
  if (Store.mode === 'local') {
    document.addEventListener('input', () => Store.saveLocal());
    document.addEventListener('change', () => Store.saveLocal());
    window.addEventListener('beforeunload', () => Store.saveLocalNow());
  }
  paint();
})();
