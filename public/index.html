<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="OwnIT! Digital Products Wave 1 — project command center: backlog, calendar, timeline, pilots, deliverables, change plan, risks and weekly executive report.">
<style>
  /* This copy is pinned to light mode: data-theme="light" on <html> keeps the
     dark blocks in the stylesheet below from ever applying, whatever the
     operating system is set to. Remove the attribute to follow the OS again. */
  :root{color-scheme:light}
  html,body{margin:0;background:#F4F7F4}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Wave 1 Command Center</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F4F7F4; --surface:#FFFFFF; --surface-2:#EEF3EF; --surface-3:#E4EDE6; --band:#E8F7E3;
  --line:#D7E2DA; --line-soft:#E6EDE8;
  --ink:#12241A; --ink-2:#3B483F; --muted:#63756A; --faint:#8A9E92;
  --green:#007A32; --green-bright:#00A142; --green-soft:#E1F3E6;
  --blue:#0272B0; --blue-soft:#E1EEF8;
  --amber:#B87400; --amber-soft:#FBF0DB;
  --rose:#B23B32; --rose-soft:#FBEAE8;
  --violet:#6C4E96; --violet-soft:#EEE8F6;
  --teal:#0E7C7B; --teal-soft:#DFF0F0;
  --shadow:0 1px 2px rgba(18,36,26,.05), 0 6px 16px -10px rgba(18,36,26,.18);
  --shadow-lift:0 2px 6px rgba(18,36,26,.09), 0 14px 28px -16px rgba(18,36,26,.3);
  --ui:"IberPangea","Segoe UI",Roboto,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1511; --surface:#141F18; --surface-2:#1A2820; --surface-3:#213228; --band:#16301E;
    --line:#2A3C31; --line-soft:#213028;
    --ink:#E8F1EA; --ink-2:#BFCEC4; --muted:#8AA295; --faint:#6D8377;
    --green:#42C06D; --green-bright:#55D480; --green-soft:#143020;
    --blue:#54B2E6; --blue-soft:#112938;
    --amber:#E4A945; --amber-soft:#32250E;
    --rose:#E68074; --rose-soft:#351A17;
    --violet:#A98BD4; --violet-soft:#231B32;
    --teal:#4FC1C0; --teal-soft:#0E2C2C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 20px -12px rgba(0,0,0,.7);
    --shadow-lift:0 2px 8px rgba(0,0,0,.5), 0 16px 32px -18px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --bg:#0C1511; --surface:#141F18; --surface-2:#1A2820; --surface-3:#213228; --band:#16301E;
  --line:#2A3C31; --line-soft:#213028;
  --ink:#E8F1EA; --ink-2:#BFCEC4; --muted:#8AA295; --faint:#6D8377;
  --green:#42C06D; --green-bright:#55D480; --green-soft:#143020;
  --blue:#54B2E6; --blue-soft:#112938;
  --amber:#E4A945; --amber-soft:#32250E;
  --rose:#E68074; --rose-soft:#351A17;
  --violet:#A98BD4; --violet-soft:#231B32;
  --teal:#4FC1C0; --teal-soft:#0E2C2C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 20px -12px rgba(0,0,0,.7);
  --shadow-lift:0 2px 8px rgba(0,0,0,.5), 0 16px 32px -18px rgba(0,0,0,.85);
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);
  font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1680px;margin:0 auto;padding-inline:18px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green-bright);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.n{font-variant-numeric:tabular-nums}

/* ── masthead ───────────────────────────── */
.masthead{background:var(--surface);border-bottom:1px solid var(--line)}
.masthead .wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center;
  justify-content:space-between;padding-block:13px}
.mh-left{display:flex;align-items:center;gap:13px;min-width:0}
.mark{width:36px;height:36px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--green),var(--green-bright));color:#fff;
  font-weight:700;font-size:13px;letter-spacing:-.02em}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--green)}
h1{font-size:19px;font-weight:700;letter-spacing:-.015em;line-height:1.15}
.mh-right{display:flex;gap:7px;align-items:center;flex-wrap:wrap}

.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
  font-size:11px;font-weight:600;border:1px solid var(--line);background:var(--surface-2);
  color:var(--muted);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.pill.live{color:var(--green);border-color:color-mix(in srgb,var(--green) 35%,transparent);background:var(--green-soft)}
.pill.live .dot{background:var(--green-bright)}
.pill.warn{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 35%,transparent);background:var(--amber-soft)}
.pill.warn .dot{background:var(--amber)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;
  padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;
  transition:background .12s,border-color .12s,transform .06s}
.btn:hover{background:var(--surface-2);border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-bright);border-color:var(--green-bright)}
.btn.sm{padding:3px 8px;font-size:11.5px;border-radius:6px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{border-color:color-mix(in srgb,var(--rose) 45%,transparent);color:var(--rose);background:var(--rose-soft)}
.btn.danger:hover{background:var(--rose);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ── tabs ───────────────────────────────── */
.tabbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.tabbar .wrap{display:flex;gap:1px;overflow-x:auto;scrollbar-width:thin}
.tab{border:0;background:none;padding:11px 13px 9px;cursor:pointer;white-space:nowrap;
  font-size:13px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;
  display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--green-bright)}
.tab .cnt{font-family:var(--mono);font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;
  background:var(--surface-2);color:var(--muted)}
.tab[aria-selected="true"] .cnt{background:var(--green-soft);color:var(--green)}

main{padding-block:18px 70px}
[role="tabpanel"][hidden]{display:none}

/* ── generic surfaces ───────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden}
.card>header{display:flex;flex-wrap:wrap;gap:9px;align-items:center;justify-content:space-between;
  padding:11px 14px;border-bottom:1px solid var(--line-soft)}
.card>header h2{font-size:13.5px;font-weight:700}
.card>header h3{font-size:12.5px;font-weight:700}
.card>header .hint{font-size:11px;color:var(--muted)}
.card .body{padding:13px 14px}
.card .body.tight{padding:9px 14px 12px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1100px){.g4,.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){.g3,.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}
.spacer{flex:1}

.lbl{display:block;font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);margin-bottom:3px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;font:inherit;font-size:13px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:7px;padding:6px 8px}
textarea{resize:vertical;min-height:56px;line-height:1.45}
input:disabled,select:disabled,textarea:disabled{background:var(--surface-2);color:var(--muted)}
select{cursor:pointer}
.src{font-size:11px;color:var(--faint);line-height:1.5}
.empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:13px}
.empty strong{display:block;color:var(--ink);font-size:14.5px;margin-bottom:4px}

/* ── badges, RAG, chips ─────────────────── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;
  font-size:10.5px;font-weight:700;white-space:nowrap}
.b-g{background:var(--green-soft);color:var(--green)}
.b-a{background:var(--amber-soft);color:var(--amber)}
.b-r{background:var(--rose-soft);color:var(--rose)}
.b-b{background:var(--blue-soft);color:var(--blue)}
.b-v{background:var(--violet-soft);color:var(--violet)}
.b-t{background:var(--teal-soft);color:var(--teal)}
.b-n{background:var(--surface-2);color:var(--muted)}
.rag{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.rag.G{background:var(--green)} .rag.A{background:var(--amber)} .rag.R{background:var(--rose)}
.rag.N{background:var(--faint)}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;
  font-weight:600;padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--muted)}
.chip.on{background:var(--green-soft);color:var(--green)}

/* ── progress ───────────────────────────── */
.bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--green);transition:width .25s}
.bar.a>i{background:var(--amber)} .bar.r>i{background:var(--rose)}
.bar.lg{height:9px;border-radius:5px}

/* ── tables ─────────────────────────────── */
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap;
  background:var(--surface);position:sticky;top:0;z-index:2}
td{padding:7px 9px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
th.r,td.r{text-align:right;font-variant-numeric:tabular-nums}

/* ── stat tiles ─────────────────────────── */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.tile .tl{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.tile .tv{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1.1;letter-spacing:-.02em;
  margin-top:5px;font-variant-numeric:tabular-nums}
.tile .tv small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.tile .ts{font-size:11px;color:var(--muted);margin-top:4px}
.tile.acc{border-left:3px solid var(--green)}
.tile.acc.a{border-left-color:var(--amber)} .tile.acc.r{border-left-color:var(--rose)}
.tile.acc.b{border-left-color:var(--blue)}

/* ── notes ──────────────────────────────── */
.note{border-left:3px solid var(--amber);background:var(--amber-soft);color:var(--ink-2);
  padding:9px 11px;border-radius:0 7px 7px 0;font-size:12px;line-height:1.5}
.note.info{border-left-color:var(--blue);background:var(--blue-soft)}
.note.good{border-left-color:var(--green);background:var(--green-soft)}
.note strong{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── sign-in ────────────────────────────── */
.auth{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
.auth-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow-lift);padding:26px 26px 22px}
.auth-err{font-size:12.5px;color:var(--rose);background:var(--rose-soft);border-radius:7px;padding:7px 10px}
</style>
<style>
/* ── kanban ─────────────────────────────── */
.kb{display:flex;gap:11px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.kcol{flex:0 0 282px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);
  display:flex;flex-direction:column;max-height:calc(100vh - 250px)}
.kcol>header{display:flex;align-items:center;gap:7px;padding:9px 11px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--surface-2);border-radius:var(--r) var(--r) 0 0;z-index:1}
.kcol h3{font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2)}
.kcol .kn{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px;
  background:var(--surface);color:var(--muted)}
.kcol .kbar{height:3px;border-radius:2px 2px 0 0}
.klist{padding:9px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:56px}
.kcol.over .klist{background:var(--green-soft);border-radius:0 0 var(--r) var(--r)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;
  cursor:grab;box-shadow:var(--shadow);display:grid;gap:6px}
.kcard:hover{border-color:var(--faint);box-shadow:var(--shadow-lift)}
.kcard.drag{opacity:.4}
.kcard .kt{font-size:12.5px;font-weight:600;line-height:1.32}
.kcard .kmeta{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.kcard .kfoot{display:flex;gap:7px;align-items:center;justify-content:space-between;
  font-size:10.5px;color:var(--muted);border-top:1px solid var(--line-soft);padding-top:6px}
.kcard .who{display:flex;align-items:center;gap:5px;min-width:0}
.av{width:19px;height:19px;border-radius:5px;flex:none;display:grid;place-items:center;
  font-size:8.5px;font-weight:700;color:#fff;background:var(--green);letter-spacing:.02em}
.due{font-family:var(--mono);font-size:10px;white-space:nowrap}
.due.late{color:var(--rose);font-weight:700}
.due.soon{color:var(--amber);font-weight:700}
.pstrip{width:3px;border-radius:2px;align-self:stretch;flex:none}

/* ── calendar ───────────────────────────── */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal .dow{background:var(--surface-2);padding:7px 9px;font-size:9.5px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--faint);text-align:center}
.cell{background:var(--surface);min-height:112px;padding:6px 7px;display:flex;flex-direction:column;gap:4px}
.cell.out{background:var(--surface-2);opacity:.55}
.cell.today{background:var(--band)}
.cell.wk{background:var(--surface-2)}
.cell .dn{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--muted);
  display:flex;justify-content:space-between;align-items:center}
.cell.today .dn{color:var(--green)}
.ev{font-size:10.5px;line-height:1.28;padding:3px 5px;border-radius:4px;cursor:pointer;
  border-left:3px solid var(--muted);background:var(--surface-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev:hover{filter:brightness(.97)}
.ev .et{font-family:var(--mono);font-size:9px;color:var(--muted);margin-right:3px}
.ev.ms{background:var(--band);border-left-color:var(--green);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:11px;align-items:center;font-size:11px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

/* ── gantt / timeline ───────────────────── */
.gt{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.gt table{border-collapse:separate;border-spacing:0;min-width:960px}
.gt th.wk{text-align:center;font-family:var(--mono);font-size:9.5px;width:52px;padding:6px 2px}
.gt th.nm,.gt td.nm{position:sticky;left:0;background:var(--surface);z-index:3;min-width:230px;
  border-right:1px solid var(--line)}
.gt th.nm{z-index:4}
.gt td{padding:0;height:31px;border-bottom:1px solid var(--line-soft)}
.gt td.nm{padding:5px 9px;font-size:12px}
.gcell{position:relative;height:31px;border-right:1px solid var(--line-soft)}
.gcell.now{background:color-mix(in srgb,var(--green) 7%,transparent)}
.gbar{position:absolute;top:7px;height:17px;border-radius:4px;background:var(--green);
  color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;padding:0 6px;
  white-space:nowrap;overflow:hidden;box-shadow:var(--shadow);z-index:1}
.gbar.a{background:var(--amber)} .gbar.r{background:var(--rose)} .gbar.b{background:var(--blue)}
.gbar.n{background:var(--faint)}
.gms{position:absolute;top:5px;width:21px;height:21px;transform:rotate(45deg);border-radius:4px;
  background:var(--surface);border:2px solid var(--green);z-index:2}
.gms.done{background:var(--green)} .gms.risk{border-color:var(--rose);background:var(--rose-soft)}
.gms.a{border-color:var(--amber);background:var(--amber-soft)}

/* ── detail drawer ──────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(10,22,15,.44);z-index:90;
  opacity:0;pointer-events:none;transition:opacity .16s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);
  border-left:1px solid var(--line);z-index:91;transform:translateX(100%);transition:transform .2s;
  display:flex;flex-direction:column;box-shadow:var(--shadow-lift)}
.drawer.on{transform:none}
.drawer>header{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dbody{overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:13px}
.drawer h2{font-size:15.5px;font-weight:700;line-height:1.25}

/* ── log / feed ─────────────────────────── */
.feed{display:grid;gap:0}
.fitem{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px}
.frail{position:relative;display:grid;justify-items:center}
.frail::before{content:"";position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.fitem:first-child .frail::before{top:10px}
.fitem:last-child .frail::before{bottom:calc(100% - 10px)}
.fdot{width:8px;height:8px;border-radius:50%;background:var(--faint);margin-top:6px;
  box-shadow:0 0 0 3px var(--surface);position:relative;z-index:1}
.fdot.g{background:var(--green)} .fdot.a{background:var(--amber)} .fdot.r{background:var(--rose)}
.fdot.b{background:var(--blue)}
.fbody{padding:2px 0 12px;min-width:0}
.fw{font-size:12.5px;font-weight:600;line-height:1.35}
.fm{font-size:10.5px;color:var(--faint);font-family:var(--mono)}
.ftx{font-size:12px;color:var(--ink-2);margin-top:3px;line-height:1.45}

/* ── editable list rows ─────────────────── */
.erow{display:grid;gap:9px;border:1px solid var(--line);border-radius:8px;padding:10px 11px;
  background:var(--surface-2)}
.erow.compact{padding:8px 10px}
.erow-top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);padding:4px 9px;font-size:11px;font-weight:700;
  cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"][data-v="G"]{background:var(--green);color:#fff}
.seg button[aria-pressed="true"][data-v="A"]{background:var(--amber);color:#fff}
.seg button[aria-pressed="true"][data-v="R"]{background:var(--rose);color:#fff}
.seg button[aria-pressed="true"]:not([data-v="G"]):not([data-v="A"]):not([data-v="R"]){
  background:var(--green);color:#fff}

/* ── executive & report document ────────── */
.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:26px 30px;max-width:1080px;margin:0 auto}
.doc-head{border-bottom:2px solid var(--green);padding-bottom:13px;margin-bottom:18px;
  display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
.doc-head h2{font-size:22px;font-weight:700;letter-spacing:-.02em}
.doc-sec{margin-top:22px;break-inside:avoid}
.doc-sec>h3{font-size:11.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--green);margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid var(--line-soft)}
.doc p{margin:0 0 9px;font-size:13px;line-height:1.55;color:var(--ink-2)}
.doc-foot{margin-top:26px;padding-top:11px;border-top:1px solid var(--line);
  font-size:10.5px;color:var(--faint);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ragbox{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:8px;
  padding:9px 12px;background:var(--surface-2)}
.ragbox .rg{width:15px;height:15px;border-radius:50%;flex:none}
.ragbox .rl{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.ragbox .rv{font-size:14px;font-weight:700;line-height:1.2}

/* ── print: the Friday pack only ────────── */
@media print{
  @page{size:A4 portrait;margin:13mm 12mm}
  :root{--bg:#fff;--surface:#fff;--surface-2:#fff;--surface-3:#EDEDED;--band:#F1F8F1;
    --ink:#111;--ink-2:#2c2c2c;--muted:#4d4d4d;--faint:#6b6b6b;
    --line:#b5b5b5;--line-soft:#dcdcdc;--shadow:none;--shadow-lift:none}
  .masthead,.tabbar,.noprint,.drawer,.scrim{display:none!important}
  main{padding:0!important}
  .wrap{max-width:none;padding:0!important}
  .doc{border:0;box-shadow:none;padding:0;max-width:none}
  .doc-sec{break-inside:avoid;page-break-inside:avoid}
  .card{break-inside:avoid;box-shadow:none;border-color:#c4c4c4}
  table{font-size:9.5pt} th{font-size:7.5pt;background:#fff!important}
  td{padding:4px 6px}
  .doc p{font-size:10pt}
  .tile .tv{font-size:19pt}
  .pagebreak{break-before:page;page-break-before:always}
  a[href]::after{content:""}
  tr,.fitem,.erow{break-inside:avoid}
}
</style>

/* ══════════════════════════════════════════════════════════════════
   Wave 1 Command Center
   One data model, four backends. The storage adapter below is the only
   place that knows where data lives — swap it for a real API and the
   rest of the app is unchanged.
   ══════════════════════════════════════════════════════════════════ */

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const initials = n => (n || '?').replace(/[^A-Za-z .]/g, '').trim().split(/[\s.]+/)
  .filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
const by = (k) => (a, b) => String(a[k] ?? '').localeCompare(String(b[k] ?? ''));

/* ── dates ──────────────────────────────────────────────────────── */
const DAY = 86400000;
const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const parse = s => s ? new Date(s + 'T12:00:00') : null;
const todayISO = () => iso(new Date());
const fmtD = s => { const d = parse(s); return d ? d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) : '—'; };
const fmtDL = s => { const d = parse(s); return d ? d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : '—'; };
const fmtTs = t => new Date(t).toLocaleDateString(undefined, { day: '2-digit', month: 'short' }) +
  ' ' + new Date(t).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };

/* project week helpers — week 1 starts on meta.start (a Monday) */
function weekOf(dateStr) {
  const s = parse(D.meta.start), d = parse(dateStr);
  if (!s || !d) return null;
  return Math.floor((d - s) / (7 * DAY)) + 1;
}
function weekStart(n) { return addDays(D.meta.start, (n - 1) * 7); }
function weekEnd(n) { return addDays(D.meta.start, (n - 1) * 7 + 4); }
function currentWeek() { return clamp(weekOf(todayISO()) || 1, 1, D.meta.weeks); }
function weekLabel(n) { return 'W' + n; }

/* ── the data ───────────────────────────────────────────────────── */
let D = null;

const COLL = ['pilots', 'milestones', 'deliverables', 'events', 'risks', 'work',
  'changeStreams', 'training', 'kpis', 'stakeholders', 'updates', 'reports', 'pilotLogs'];
const SINGLE = ['meta', 'activityTemplate'];

function freshData() { return JSON.parse(JSON.stringify(SEED)); }

/* ── plan versioning ────────────────────────────────────────────────
   The seeded plan changes when the client confirms something — a new
   track, a renamed pilot. A copy already holding data must pick that up
   without losing what people typed, so every stored payload carries the
   plan version it was written against and is migrated forward on load. */
const PLAN_VERSION = 4;

/** v1 -> v2: the confirmed 11-track line-up. Maine became UIL, the NY
    Demand Registration track was added, and the CMP and UIL pairs swapped
    position, so ids shift and cannot simply be matched by number.       */
const V2_MAP = {
  P01: 'P02', P02: 'P03', P03: 'P04', P04: 'P05', P05: 'P06',
  P06: 'P07', P07: 'P10', P08: 'P11', P09: 'P08', P10: 'P09',
};
/** fields a person edits — everything else comes from the seed */
const PILOT_USER_FIELDS = ['rag', 'phase', 'summary', 'nextStep', 'blockers', 'startWeek', 'endWeek'];

function migratePlan(from) {
  if (from >= PLAN_VERSION) return;

  // v1 -> v2 is the only structural step: ids move. Everything after it is a
  // reference-data refresh, which runs for any version behind the current one.
  const looksV1 = Array.isArray(D.pilots) && D.pilots.length === 10 &&
    !D.pilots.some(p => p.id === 'P11') &&
    D.pilots.some(p => /Maine/i.test(p.name || '') || /^G&E \(ITBA\)$/.test(p.name || ''));
  if (from < 2 && looksV1) remapV1toV2();

  // v3 -> v4: NY Demand Registration is milestone M2A, not a lifecycle pilot.
  // It leaves the line-up and every id below it shifts down one.
  const looksV3 = Array.isArray(D.pilots) &&
    (D.pilots.length === 11 || D.pilots.some(p => p.id === 'P11'));
  if (from < 4 && looksV3) remapV3toV4();

  refreshReferenceData();

  D.planVersion = PLAN_VERSION;
  setTimeout(() => flash('Plan updated to the current line-up. Your entries were kept.'), 600);
}

/** Re-apply everything the seed owns, keeping everything a person typed. */
function refreshReferenceData() {
  const edits = {};
  for (const p of (D.pilots || [])) {
    const keep = {};
    for (const f of PILOT_USER_FIELDS) if (p[f] !== undefined) keep[f] = p[f];
    if (Array.isArray(p.successCriteria)) keep.successCriteria = p.successCriteria;
    edits[p.id] = keep;
  }
  D.pilots = JSON.parse(JSON.stringify(SEED.pilots)).map(p =>
    edits[p.id] ? { ...p, ...edits[p.id] } : p);
  D.activityTemplate = JSON.parse(JSON.stringify(SEED.activityTemplate));

  const haveE = new Set((D.events || []).map(e => e.id));
  for (const e of SEED.events) if (!haveE.has(e.id)) D.events.push(JSON.parse(JSON.stringify(e)));
  const haveR = new Set((D.risks || []).map(r => r.name));
  for (const r of SEED.risks) if (!haveR.has(r.name)) D.risks.push(JSON.parse(JSON.stringify(r)));
}

const V4_MAP = {
  P02: 'P01', P03: 'P02', P04: 'P03', P05: 'P04', P06: 'P05',
  P07: 'P06', P08: 'P07', P09: 'P08', P10: 'P09', P11: 'P10',
};
/* ids dropped by a migration — a shared store must delete these, not just
   stop writing them, or the removed record lingers and the line-up is wrong */
let REMOVED_PILOTS = [];

function remapV3toV4() {
  const gone = 'P01';                       // the registration track
  // every id shifts down, so the highest id is left with no successor
  REMOVED_PILOTS = Array.from(new Set(REMOVED_PILOTS.concat(
    D.pilots.map(p => p.id).filter(id => !Object.values(V4_MAP).includes(id)))));
  D.pilots = D.pilots.filter(p => p.id !== gone)
    .map(p => V4_MAP[p.id] ? { ...p, id: V4_MAP[p.id] } : p);

  const move = id => {
    const m = String(id).match(/^(P\d+)-(.+)$/);
    if (!m) return null;
    if (m[1] === gone) return null;         // its cards go with it
    return (V4_MAP[m[1]] || m[1]) + '-' + m[2];
  };
  D.work = (D.work || []).map(w => ({ ...w, id: move(w.id) })).filter(w => w.id);
  D.pilotLogs = (D.pilotLogs || []).filter(l => l.id !== gone)
    .map(l => ({ ...l, id: V4_MAP[l.id] || l.id }));
  D.risks = (D.risks || []).map(r => ({
    ...r, pilot: r.pilot === gone ? '' : (V4_MAP[r.pilot] || r.pilot) }));
  D.events = (D.events || []).map(e => ({
    ...e, pilot: e.pilot === gone ? '' : (V4_MAP[e.pilot] || e.pilot) }));
}

function remapV1toV2() {
  const carried = {};
  for (const p of (D.pilots || [])) {
    const to = V2_MAP[p.id];
    if (!to) continue;
    const keep = {};
    for (const f of PILOT_USER_FIELDS) if (p[f] !== undefined) keep[f] = p[f];
    if (Array.isArray(p.successCriteria)) keep.successCriteria = p.successCriteria;
    carried[to] = keep;
  }
  // carry each pilot's edits onto its new id; refreshReferenceData then
  // rebuilds the pilot records themselves from the seed
  D.pilots = (D.pilots || []).map(p =>
    V2_MAP[p.id] ? { ...p, id: V2_MAP[p.id] } : p);
  for (const p of D.pilots) if (carried[p.id]) Object.assign(p, carried[p.id]);

  const remapId = id => {
    const m = String(id).match(/^(P\d+)-(.+)$/);
    return m && V2_MAP[m[1]] ? V2_MAP[m[1]] + '-' + m[2] : id;
  };
  D.work = (D.work || []).map(w => ({ ...w, id: remapId(w.id) }));
  D.pilotLogs = (D.pilotLogs || []).map(l => ({ ...l, id: V2_MAP[l.id] || l.id }));
  D.risks = (D.risks || []).map(r => ({ ...r, pilot: V2_MAP[r.pilot] || r.pilot }));
  D.events = (D.events || []).map(e => ({ ...e, pilot: V2_MAP[e.pilot] || e.pilot }));
}

/* ── storage adapter ────────────────────────────────────────────────
   mode 'db'     — the Claude artifact database: shared and live.
   mode 'local'  — this browser only; for a downloaded or self-hosted copy.
   mode 'memory' — nothing is kept; the page still works for the visit.
   A production backend replaces this object and nothing else.        */
const Store = {
  mode: 'memory', db: null, timers: {},
  /* api mode: change cursor, write queue, and the keys with unflushed writes */
  cursor: 0, queue: new Map(), pending: new Set(), flushT: null, inflight: null,
  pollT: null, polling: false, online: true, apiError: '', dirtyPaint: false,

  async init() {
    let db = null;
    try { db = await window.claude?.use?.('db'); } catch (_) { db = null; }
    if (db) { this.db = db; this.mode = 'db'; return this.initDb(); }
    // a hosted copy talks to /api/sync — a Vercel function in front of Neon
    const viaApi = await this.initApi();
    if (viaApi !== null) { this.mode = 'api'; return viaApi; }
    let ok = false;
    try { localStorage.setItem('cc.probe', '1'); localStorage.removeItem('cc.probe'); ok = true; } catch (_) {}
    this.mode = ok ? 'local' : 'memory';
    if (ok) this.loadLocal();
    return false;
  },

  /* — project database, through /api/sync — */
  headers() {
    const h = { 'Content-Type': 'application/json' };
    if (Auth.token) h['Authorization'] = 'Bearer ' + Auth.token;
    return h;
  },
  async initApi() {
    if (!/^https?:$/.test(location.protocol)) return null;      // a file:// copy has no API
    let r = null;
    for (;;) {
      try { r = await fetch('/api/sync?since=0', { headers: this.headers(), cache: 'no-store' }); }
      catch (_) { this.apiError = 'the server could not be reached'; return null; }
      if (r.status === 404) return null;                          // not a hosted copy
      if (r.status !== 401 && r.status !== 403) break;
      let why = '';
      if (Auth.token) { try { why = (await r.json()).error || ''; } catch (_) {} Auth.token = ''; }
      await Auth.show(why && r.status === 403 ? why : '');
    }
    if (!Auth.user) { try { Auth.user = (await Auth.call('me')).user; Auth.paintPill(); } catch (_) {} }
    if (!r || !r.ok) {
      let msg = 'HTTP ' + (r ? r.status : '?');
      try { msg = (await r.json()).error || msg; } catch (_) {}
      this.apiError = msg; return null;
    }
    const body = await r.json();
    // start from an empty model and let the database fill it
    D = freshData();
    for (const c of COLL) D[c] = [];
    this.applyRows(body.rows || []);
    let seeded = false;
    if (!(body.rows || []).some(x => x.coll === 'config' && x.id === 'meta')) {
      D = freshData();
      this.queueAll();
      await this.flushNow();
      seeded = true;
    } else if ((D.meta.planVersion || 1) < PLAN_VERSION && D.pilots.length) {
      // a store written by an older build is brought forward once
      migratePlan(D.meta.planVersion || 1);
      D.meta.planVersion = PLAN_VERSION;
      this.queueAll();
      const live = new Set(D.pilots.map(p => p.id));
      for (const id of REMOVED_PILOTS) if (!live.has(id)) this.remove('pilots', id);
      await this.flushNow();
    }
    this.pollT = setInterval(() => this.poll(), 4000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.poll(); });
    document.addEventListener('focusout', () => setTimeout(() => {
      if (this.dirtyPaint && !editing()) { this.dirtyPaint = false; paint(); }
    }, 60));
    window.addEventListener('beforeunload', () => { if (this.queue.size) this.flushNow(true); });
    return seeded;
  },
  /** fold rows from the server into D; returns true if anything changed */
  applyRows(rows) {
    let changed = false;
    for (const r of rows) {
      if (r.seq > this.cursor) this.cursor = r.seq;
      const key = r.coll + '/' + r.id;
      if (this.pending.has(key)) continue;                        // ours, not yet flushed
      if (r.coll === 'config') {
        if (r.id === 'meta' && r.data) {
          const next = { ...SEED.meta, ...r.data };
          if (canon(next) !== canon(D.meta)) { D.meta = next; changed = true; }
        } else if (r.id === 'activityTemplate' && r.data && Array.isArray(r.data.list)) {
          if (canon(r.data.list) !== canon(D.activityTemplate)) { D.activityTemplate = r.data.list; changed = true; }
        }
        continue;
      }
      if (!COLL.includes(r.coll)) continue;
      const list = D[r.coll] || (D[r.coll] = []);
      const i = list.findIndex(x => x.id === r.id);
      if (r.deleted) { if (i >= 0) { list.splice(i, 1); changed = true; } continue; }
      const rec = { ...(r.data || {}), id: r.id };
      if (i < 0) { list.push(rec); changed = true; }
      else if (canon(list[i]) !== canon(rec)) { list[i] = rec; changed = true; }
    }
    return changed;
  },
  async poll() {
    if (this.polling || document.hidden) return;
    this.polling = true;
    try {
      const r = await fetch('/api/sync?since=' + this.cursor, { headers: this.headers(), cache: 'no-store' });
      if (r.status === 401 || r.status === 403) { Auth.signOut(); return; }
      if (!r.ok) { this.setOnline(false); return; }
      const body = await r.json();
      this.setOnline(true);
      if (this.applyRows(body.rows || [])) {
        if (editing()) this.dirtyPaint = true; else paint();
      }
    } catch (_) { this.setOnline(false); }
    finally { this.polling = false; }
  },
  setOnline(on, why) {
    if (on === this.online) return;
    this.online = on;
    const pill = $('#syncPill'), txt = $('#syncTxt');
    if (!pill) return;
    pill.classList.toggle('live', on); pill.classList.toggle('warn', !on);
    txt.textContent = on ? 'Shared · saved live' : 'Offline — retrying';
    if (!on) flash('Lost the connection to the database' + (why ? ': ' + why : '') + '. Changes are kept and retried.', 'warn');
    else if (this.queue.size) this.flush();
  },
  enqueue(op) {
    const key = op.coll + '/' + op.id;
    this.queue.set(key, op); this.pending.add(key);
    this.flush();
  },
  queueAll() {
    this.enqueue({ coll: 'config', id: 'meta', data: D.meta });
    this.enqueue({ coll: 'config', id: 'activityTemplate', data: { list: D.activityTemplate } });
    for (const c of COLL) for (const r of (D[c] || [])) this.enqueue({ coll: c, id: r.id, data: r });
  },
  flush() {
    clearTimeout(this.flushT);
    this.flushT = setTimeout(() => this.flushNow(), 400);
  },
  async flushNow(unloading) {
    clearTimeout(this.flushT);
    if (this.inflight) { await this.inflight; }
    if (!this.queue.size) return;
    const ops = Array.from(this.queue.values()).map(o => o.delete ? o : { ...o, data: JSON.parse(JSON.stringify(o.data)) });
    const keys = Array.from(this.queue.keys());
    this.queue.clear();
    this.inflight = (async () => {
      try {
        for (let i = 0; i < ops.length; i += 400) {
          const r = await fetch('/api/sync', { method: 'POST', headers: this.headers(),
            body: JSON.stringify({ ops: ops.slice(i, i + 400) }), keepalive: !!unloading });
          if (!r.ok) throw new Error('HTTP ' + r.status);
        }
        this.setOnline(true);
      } catch (e) {
        // put back anything that has not been overwritten by a newer write
        for (const o of ops) { const k = o.coll + '/' + o.id; if (!this.queue.has(k)) this.queue.set(k, o); }
        this.setOnline(false);
        setTimeout(() => this.flush(), 5000);
        return;
      } finally { this.inflight = null; }
      for (const k of keys) if (!this.queue.has(k)) this.pending.delete(k);
    })();
    await this.inflight;
  },

  /* — artifact database — */
  async initDb() {
    const db = this.db;
    let seeded = false;
    try {
      const s = await db.doc('config/meta').get();
      if (!s.exists) { await this.seedDb(); seeded = true; }
    } catch (e) { console.warn('meta read', e.code || e); }

    let migrated = false;
    db.doc('config/meta').onSnapshot(s => {
      if (!s.exists) return;
      D.meta = { ...SEED.meta, ...s.data() };
      // a shared store written by an older build is brought forward once,
      // after its collections have arrived; migratePlan no-ops unless the
      // data really is the older plan
      if (!migrated && !seeded && (D.meta.planVersion || 1) < PLAN_VERSION && D.pilots.length) {
        migrated = true;
        migratePlan(D.meta.planVersion || 1);
        D.meta.planVersion = PLAN_VERSION;
        pushAll();
        // records the migration dropped have to be removed from the shared
        // store as well, or every viewer keeps seeing them
        const live = new Set(D.pilots.map(p => p.id));
        for (const id of REMOVED_PILOTS) {
          if (!live.has(id)) this.remove('pilots', id);
        }
      }
      paint();
    }, () => {});
    db.doc('config/activityTemplate').onSnapshot(s => {
      if (s.exists && Array.isArray(s.data().list)) { D.activityTemplate = s.data().list; paint(); }
    }, () => {});
    for (const c of COLL) {
      db.collection(c).onSnapshot(snap => {
        D[c] = snap.docs.map(d => ({ ...d.data(), id: d.id }));
        paint();
      }, e => console.warn(c, e.code));
    }
    return seeded;
  },

  async seedDb() {
    const db = this.db;
    await db.doc('config/meta').set(SEED.meta);
    await db.doc('config/activityTemplate').set({ list: SEED.activityTemplate });
    for (const c of COLL) {
      const rows = SEED[c];
      if (!Array.isArray(rows) || !rows.length) continue;
      // written one at a time: a first-run seed, not a hot path
      for (const r of rows) { try { await db.doc(c + '/' + r.id).set(r); } catch (_) {} }
    }
  },

  /* — browser storage — */
  loadLocal() {
    try {
      const raw = localStorage.getItem('cc.wave1.v1');
      if (!raw) return;
      const d = JSON.parse(raw);
      D = { ...freshData(), ...d, meta: { ...SEED.meta, ...(d.meta || {}) } };
      // a stored copy from an older build would otherwise keep its stale plan
      // for ever, because restoring it skips the seed entirely
      if ((d.planVersion || 1) < PLAN_VERSION) migratePlan(d.planVersion || 1);
    } catch (_) {}
  },
  saveLocalNow() {
    if (this.mode !== 'local') return;
    try { localStorage.setItem('cc.wave1.v1', JSON.stringify({ ...D, planVersion: PLAN_VERSION })); }
    catch (e) { flash('Browser storage is full — export a backup from Data & setup.', 'warn'); }
  },
  saveLocal() {
    clearTimeout(this.timers.__l);
    this.timers.__l = setTimeout(() => this.saveLocalNow(), 350);
  },

  /* — the two calls the app makes — */
  save(coll, obj) {
    if (this.mode === 'api') { this.enqueue({ coll, id: obj.id, data: obj }); return; }
    if (this.mode === 'db' && this.db) {
      clearTimeout(this.timers[coll + obj.id]);
      this.timers[coll + obj.id] = setTimeout(() => {
        this.db.doc(coll + '/' + obj.id).set(JSON.parse(JSON.stringify(obj)))
          .catch(e => console.warn('save', coll, e.code || e));
      }, 400);
    } else this.saveLocal();
  },
  remove(coll, id) {
    if (this.mode === 'api') { this.enqueue({ coll, id, delete: true }); return; }
    if (this.mode === 'db' && this.db) {
      this.db.doc(coll + '/' + id).delete().catch(e => console.warn('del', e.code || e));
    } else this.saveLocal();
  },
  saveMeta() {
    if (this.mode === 'api') { this.enqueue({ coll: 'config', id: 'meta', data: D.meta }); return; }
    if (this.mode === 'db' && this.db) {
      clearTimeout(this.timers.__m);
      this.timers.__m = setTimeout(() => {
        this.db.doc('config/meta').set(JSON.parse(JSON.stringify(D.meta)))
          .catch(e => console.warn('meta', e.code || e));
      }, 400);
    } else this.saveLocal();
  },
  saveTemplate() {
    if (this.mode === 'api') { this.enqueue({ coll: 'config', id: 'activityTemplate', data: { list: D.activityTemplate } }); return; }
    if (this.mode === 'db' && this.db) {
      this.db.doc('config/activityTemplate').set({ list: D.activityTemplate }).catch(() => {});
    } else this.saveLocal();
  },
};

/** true while the person is typing in a field — a repaint would eat their focus */
function editing() {
  const a = document.activeElement;
  return !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'range';
}
/** JSON with sorted keys, so a record that round-tripped through Postgres compares equal */
function canon(v) {
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}

/* ── the update log — what the executive view reads ─────────────── */
function logUpdate(what, detail, kind = 'n', ref = '') {
  const u = { id: uid('U'), ts: Date.now(), what, detail, kind, ref, who: (Auth.user && Auth.user.name) || D.meta.whoAmI || '' };
  D.updates.push(u);
  Store.save('updates', u);
  return u;
}

/* ── work items: template × pilots, with sparse overrides ───────── */
const STATUSES = [
  { k: 'backlog', t: 'Backlog', c: 'var(--faint)' },
  { k: 'ready', t: 'Ready', c: 'var(--blue)' },
  { k: 'progress', t: 'In progress', c: 'var(--green-bright)' },
  { k: 'blocked', t: 'Blocked', c: 'var(--rose)' },
  { k: 'review', t: 'In review', c: 'var(--violet)' },
  { k: 'done', t: 'Done', c: 'var(--green)' },
];
const PHASES = ['Pilot Readiness', 'Demand Management', 'Preparation & Planning',
  'Execution & Delivery', 'Deployment', 'Pilot Closure'];
const PHASE_C = {
  'Pilot Readiness': 'var(--teal)', 'Demand Management': 'var(--blue)',
  'Preparation & Planning': 'var(--violet)', 'Execution & Delivery': 'var(--green-bright)',
  'Deployment': 'var(--amber)', 'Pilot Closure': 'var(--green)',
};

const ovMap = () => {
  const m = {};
  for (const o of D.work) m[o.id] = o;
  return m;
};
/** every board card: 43 activities × each pilot, merged with its override */
function allWork() {
  const ov = ovMap(), out = [];
  for (const p of D.pilots) {
    for (const a of D.activityTemplate) {
      const id = p.id + '-' + a.id;
      const o = ov[id] || {};
      out.push({
        id, pilot: p.id, pilotShort: p.short, act: a.id, phase: a.phase,
        title: a.title, role: a.role, output: a.output, gate: a.gate,
        startWk: o.startWk ?? a.startWk, endWk: o.endWk ?? a.endWk,
        status: o.status || 'backlog', owner: o.owner || '', notes: o.notes || '',
        due: o.due || weekEnd(o.endWk ?? a.endWk),
        pct: o.pct ?? (o.status === 'done' ? 100 : 0),
        blocker: o.blocker || '',
      });
    }
  }
  return out;
}
function getWork(id) { return allWork().find(w => w.id === id); }
/** write an override — only the fields that differ from the template */
function setWork(id, patch) {
  const ov = ovMap();
  const cur = ov[id] || { id };
  const next = { ...cur, ...patch };
  const i = D.work.findIndex(w => w.id === id);
  if (i >= 0) D.work[i] = next; else D.work.push(next);
  Store.save('work', next);
  return next;
}

/* ── computed roll-ups ──────────────────────────────────────────── */
function pilotProgress(pid) {
  const items = allWork().filter(w => w.pilot === pid);
  const done = items.filter(w => w.status === 'done').length;
  const active = items.filter(w => w.status === 'progress' || w.status === 'review').length;
  const blocked = items.filter(w => w.status === 'blocked').length;
  return { total: items.length, done, active, blocked, pct: Math.round(done / items.length * 100) };
}
function overallProgress() {
  const items = allWork();
  const done = items.filter(w => w.status === 'done').length;
  return { total: items.length, done, pct: Math.round(done / items.length * 100) };
}
function ragOf(v) { return { G: 'Green', A: 'Amber', R: 'Red', N: 'Not set' }[v] || 'Not set'; }
function ragCls(v) { return { G: 'b-g', A: 'b-a', R: 'b-r' }[v] || 'b-n'; }
function dueClass(d, status) {
  if (status === 'done' || !d) return '';
  const t = todayISO();
  if (d < t) return 'late';
  if (d <= addDays(t, 7)) return 'soon';
  return '';
}
function pilotLog(pid) {
  let l = D.pilotLogs.find(x => x.id === pid);
  if (!l) { l = { id: pid, meetings: [], results: [], learnings: [] }; D.pilotLogs.push(l); }
  l.meetings = l.meetings || []; l.results = l.results || []; l.learnings = l.learnings || [];
  return l;
}

/* ── tiny UI helpers ────────────────────────────────────────────── */
function opts(list, sel) {

    const [v, l] = Array.isArray(o) ? o : [o, o];
    return `<option value="${esc(v)}"${String(v) === String(sel) ? ' selected' : ''}>${esc(l)}</option>`;
  }).join('');
}
function ragSeg(attr, id, cur) {
  return `<div class="seg" role="group" aria-label="RAG status">${['G', 'A', 'R'].map(v =>
    `<button type="button" data-${attr}="${esc(id)}" data-v="${v}" aria-pressed="${cur === v}">${v}</button>`).join('')}</div>`;
}
function bar(pct, cls = '') {
  return `<div class="bar ${cls}"><i style="width:${clamp(pct || 0, 0, 100)}%"></i></div>`;
}
let flashT = null;
function flash(msg, kind = 'good') {
  let el = $('#flash');
  if (!el) {
    el = document.createElement('div'); el.id = 'flash';
    el.style.cssText = 'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:120;' +
      'padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lift);' +
      'border:1px solid var(--line);max-width:90vw;text-align:center';
    el.className = 'noprint';
    document.body.appendChild(el);

  el.style.background = kind === 'warn' ? 'var(--amber-soft)' : 'var(--green-soft)';

  el.style.display = 'block';
  clearTimeout(flashT);
  flashT = setTimeout(() => { el.style.display = 'none'; }, 2600);
}
/* ══ 1 · EXECUTIVE SUMMARY ═════════════════════════════════════════
   Reads from every other view. Nothing is typed twice: the RAG, the
   milestone position, pilot progress, risks and deliverables are all
   computed from what the team has been updating during the week.     */
function renderExec() {
  const el = $('#panel-exec');
  const wk = currentWeek(), P = overallProgress();
  const ms = D.milestones.slice().sort((a, b) => a.week - b.week);
  const nextMs = ms.find(m => m.status !== 'done');
  const msDone = ms.filter(m => m.status === 'done').length;
  const openRisks = D.risks.filter(r => r.status === 'open');
  const highRisks = openRisks.filter(r => r.sev === 'H');
  const blocked = allWork().filter(w => w.status === 'blocked');
  const delivOn = D.deliverables.filter(d => d.rag === 'G').length;
  const pilotsRed = D.pilots.filter(p => p.rag === 'R');
  const pilotsAmber = D.pilots.filter(p => p.rag === 'A');
  const recent = D.updates.slice().sort((a, b) => b.ts - a.ts).slice(0, 12);

  // an honest suggestion, not an imposed verdict — the lead sets the RAG
  const suggested = highRisks.length >= 2 || pilotsRed.length ? 'R'
    : (highRisks.length || pilotsAmber.length >= 3 || blocked.length >= 5) ? 'A' : 'G';

  el.innerHTML = `<div class="stack">
    <div class="tiles">
      <div class="tile acc ${D.meta.overallRag === 'R' ? 'r' : D.meta.overallRag === 'A' ? 'a' : ''}">
        <div class="tl">Overall status</div>
        <div class="tv" style="font-size:21px;display:flex;align-items:center;gap:9px">
          <span class="rag ${D.meta.overallRag}" style="width:15px;height:15px"></span>${ragOf(D.meta.overallRag)}</div>
        <div class="ts">${D.meta.overallRag === suggested ? 'Matches the data'
          : `Data suggests <strong>${ragOf(suggested)}</strong>`}</div>
      </div>
      <div class="tile acc b"><div class="tl">Wave progress</div>
        <div class="tv">${wk}<small>/ ${D.meta.weeks} weeks</small></div>
        <div class="ts">${fmtD(weekStart(wk))} – ${fmtD(weekEnd(wk))}</div></div>
      <div class="tile acc"><div class="tl">Activities complete</div>
        <div class="tv">${P.pct}<small>%</small></div>
        <div class="ts">${P.done} of ${P.total} across ${D.pilots.length} pilots</div></div>
      <div class="tile acc"><div class="tl">Milestones met</div>
        <div class="tv">${msDone}<small>/ ${ms.length}</small></div>
        <div class="ts">${nextMs ? `Next: ${nextMs.id} · ${weekLabel(nextMs.week)}` : 'All milestones met'}</div></div>
      <div class="tile acc ${highRisks.length ? 'r' : 'a'}"><div class="tl">Open risks</div>
        <div class="tv">${openRisks.length}<small>${highRisks.length ? ` · ${highRisks.length} high` : ''}</small></div>
        <div class="ts">${blocked.length} blocked activit${blocked.length === 1 ? 'y' : 'ies'}</div></div>
      <div class="tile acc"><div class="tl">Deliverables on track</div>
        <div class="tv">${delivOn}<small>/ ${D.deliverables.length}</small></div>
        <div class="ts">D1–D6 · due W10–W14</div></div>
    </div>

    <div class="cols" style="display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;align-items:start">
      <div class="stack">
        <div class="card">
          <header><h2>Pilot status</h2>
            <span class="row"><button class="btn sm" data-go="pilots">Open pilot views</button></span></header>
          <div class="tscroll"><table>
            <thead><tr><th>Pilot</th><th>Area</th><th>Phase</th><th style="width:150px">Progress</th>
              <th class="r">Done</th><th class="r">Blocked</th><th>RAG</th><th>Next step</th></tr></thead>
            <tbody>${D.pilots.map(p => {
              const pr = pilotProgress(p.id);
              return `<tr data-openpilot="${p.id}" style="cursor:pointer">
                <td><div style="font-weight:600">${esc(p.short)}</div>
                  ${p.projectName ? `<div style="font-size:11px;color:var(--green);font-weight:600">${esc(p.projectName)}</div>` : ''}
                  <div class="src mono">${p.id}${p.jiraRef ? ' · ' + esc(p.jiraRef) : ' · ' + esc(p.jiraKey)}</div></td>
                <td><span class="badge ${p.area === 'CS' ? 'b-b' : 'b-t'}">${p.area}</span></td>
                <td style="font-size:11.5px">${esc(p.phase)}</td>
                <td>${bar(pr.pct, pr.blocked ? 'r' : '')}<div class="src mono" style="margin-top:3px">${pr.pct}%</div></td>
                <td class="r mono">${pr.done}/${pr.total}</td>
                <td class="r mono" style="${pr.blocked ? 'color:var(--rose);font-weight:700' : 'color:var(--faint)'}">${pr.blocked || '–'}</td>
                <td><span class="badge ${ragCls(p.rag)}">${p.rag === 'N' ? '—' : p.rag}</span></td>
                <td style="font-size:11.5px;color:var(--muted);max-width:230px">${esc(p.nextStep || '—')}</td>
              </tr>`;
            }).join('')}</tbody>
          </table></div>
        </div>

        <div class="card">
          <header><h2>Milestones</h2><span class="hint">${msDone} met · ${ms.length - msDone} ahead</span></header>
          <div class="body tight">${ms.map(m => {
            const st = m.status === 'done' ? ['b-g', 'Met'] : m.week < wk ? ['b-r', 'Overdue']
              : m.week === wk ? ['b-a', 'This week'] : ['b-n', weekLabel(m.week)];
            return `<div style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;
              border-bottom:1px solid var(--line-soft)">
              <span class="chip mono" style="flex:none">${m.id}</span>
              <div style="flex:1;min-width:0">
                <div style="font-size:12.5px;font-weight:600">${esc(m.name)}</div>
                <div class="src">${esc(m.owner)}</div>
              </div>
              <span class="badge ${st[0]}" style="flex:none">${st[1]}</span>
            </div>`;
          }).join('')}</div>
        </div>
      </div>

      <div class="stack">
        <div class="card">
          <header><h2>Set the status</h2><span class="hint">carries to the Friday report</span></header>
          <div class="body">
            <span class="lbl">Overall RAG — the lead's judgement</span>
            <div class="row" style="margin-bottom:10px">
              ${['G', 'A', 'R'].map(v => `<button class="btn ${D.meta.overallRag === v ? 'primary' : ''}"
                data-setrag="${v}">${ragOf(v)}</button>`).join('')}
            </div>
            ${D.meta.overallRag !== suggested ? `<div class="note" style="margin-bottom:10px">
              The data points to <strong>${ragOf(suggested)}</strong>${
                highRisks.length ? ` — ${highRisks.length} high risk${highRisks.length === 1 ? '' : 's'} open` : ''}${
                pilotsRed.length ? `, ${pilotsRed.length} pilot${pilotsRed.length === 1 ? '' : 's'} red` : ''}${
                blocked.length >= 5 ? `, ${blocked.length} activities blocked` : ''}.
              Override it if you have context the data doesn't, and say why below.</div>` : ''}
            <span class="lbl">Status commentary</span>
            <textarea data-meta="ragNote" placeholder="One paragraph the sponsor reads first: where the wave stands, what changed this week, what needs a decision.">${esc(D.meta.ragNote)}</textarea>
          </div>
        </div>

        <div class="card">
          <header><h2>Top risks</h2><span class="row"><button class="btn sm" data-go="risks">All ${openRisks.length}</button></span></header>
          <div class="body tight">${openRisks.length ? openRisks
            .sort((a, b) => 'HML'.indexOf(a.sev) - 'HML'.indexOf(b.sev)).slice(0, 5).map(r =>
            `<div style="display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line-soft)">
              <span class="badge ${r.sev === 'H' ? 'b-r' : r.sev === 'M' ? 'b-a' : 'b-n'}" style="flex:none">${r.sev}</span>
              <div style="min-width:0">
                <div style="font-size:12.5px;font-weight:600">${esc(r.name)}</div>
                <div class="src">${esc(r.owner)}${r.type ? ' · ' + esc(r.type) : ''}</div>
              </div>
            </div>`).join('') : '<p class="src" style="margin:0">No open risks.</p>'}</div>
        </div>

        <div class="card">
          <header><h2>Recent activity</h2><span class="hint">${D.updates.length} logged</span></header>
          <div class="body tight">${recent.length ? `<div class="feed">${recent.map(u => `
            <div class="fitem"><div class="frail"><span class="fdot ${esc(u.kind)}"></span></div>
              <div class="fbody">
                <div class="fw">${esc(u.what)}</div>
                <div class="fm">${esc(fmtTs(u.ts))}${u.ref ? ' · ' + esc(u.ref) : ''}${u.who ? ' · ' + esc(u.who) : ''}</div>
                ${u.detail ? `<div class="ftx">${esc(u.detail)}</div>` : ''}
              </div></div>`).join('')}</div>`
            : '<p class="src" style="margin:0">Nothing logged yet. Status changes, decisions and results recorded in the other views appear here and feed the Friday report.</p>'}</div>
        </div>
      </div>
    </div>
  </div>`;
}
/* ══ 2 · BACKLOG — Kanban ══════════════════════════════════════════
   430 cards (43 lifecycle activities × 10 pilots). Filters first, then
   the board: an unfiltered 430-card wall helps nobody.               */
const F = { pilot: '', phase: '', status: '', owner: '', q: '', mine: false };

function renderBacklog() {
  const el = $('#panel-backlog');
  let items = allWork();
  if (F.pilot) items = items.filter(w => w.pilot === F.pilot);
  if (F.phase) items = items.filter(w => w.phase === F.phase);
  if (F.owner) items = items.filter(w => (w.owner || '') === F.owner);
  if (F.q) {
    const q = F.q.toLowerCase();
    items = items.filter(w => (w.title + ' ' + w.act + ' ' + w.pilotShort + ' ' + w.role).toLowerCase().includes(q));
  }
  const owners = Array.from(new Set(allWork().map(w => w.owner).filter(Boolean))).sort();
  const counts = {};
  for (const s of STATUSES) counts[s.k] = items.filter(w => w.status === s.k).length;
  const late = items.filter(w => w.status !== 'done' && w.due < todayISO()).length;

  el.innerHTML = `<div class="stack">
    <div class="card noprint"><div class="body tight">
      <div class="row" style="gap:9px">
        <div style="min-width:190px;flex:1;max-width:280px">
          <span class="lbl">Search</span>
          <input type="text" id="fq" value="${esc(F.q)}" placeholder="Activity, ID, role…"></div>
        <div style="min-width:150px"><span class="lbl">Pilot</span>
          <select id="fpilot">${opts([['', 'All pilots']].concat(D.pilots.map(p => [p.id, p.id + ' · ' + p.short])), F.pilot)}</select></div>
        <div style="min-width:165px"><span class="lbl">Phase</span>
          <select id="fphase">${opts([['', 'All phases']].concat(PHASES), F.phase)}</select></div>
        <div style="min-width:150px"><span class="lbl">Owner</span>
          <select id="fowner">${opts([['', 'Anyone']].concat(owners), F.owner)}</select></div>
        <div class="spacer"></div>
        <div class="row" style="align-self:flex-end">
          ${late ? `<span class="badge b-r">${late} overdue</span>` : ''}
          <span class="badge b-n">${items.length} of ${allWork().length}</span>
          <button class="btn sm" id="clearF">Clear filters</button>
          <button class="btn sm primary" id="addWork">＋ Add activity</button>
        </div>
      </div>
    </div></div>

    <div class="kb" id="board">${STATUSES.map(s => {
      const col = items.filter(w => w.status === s.k)
        .sort((a, b) => (a.due || '').localeCompare(b.due || '') || a.act.localeCompare(b.act));
      // a column of 400 cards helps nobody and slows the board — show the
      // most urgent, and say plainly how many are behind them
      const CAP = 60, shown = col.slice(0, CAP);
      return `<section class="kcol" data-col="${s.k}">
        <div class="kbar" style="background:${s.c}"></div>
        <header><h3>${esc(s.t)}</h3><span class="kn">${col.length}</span></header>
        <div class="klist" data-drop="${s.k}">
          ${shown.map(w => card(w)).join('') || '<div class="src" style="padding:8px 2px">Nothing here.</div>'}
          ${col.length > CAP ? `<div class="src" style="padding:8px 4px;text-align:center">
            ${col.length - CAP} more, sorted behind these by due date.<br>Filter by pilot or phase to reach them.</div>` : ''}
        </div>
      </section>`;
    }).join('')}</div>

    <div class="card noprint"><div class="body tight">
      <div class="legend">${PHASES.map(p =>
        `<span><i style="background:${PHASE_C[p]}"></i>${esc(p)}</span>`).join('')}
        <span class="spacer"></span>
        <span class="src">Cards are the 43 lifecycle activities from the Detailed Workplan, one set per pilot.
          Drag between columns, or click a card to edit it.</span>
      </div>
    </div></div>
  </div>`;
}

function card(w) {
  const dc = dueClass(w.due, w.status);
  return `<article class="kcard" draggable="true" data-card="${w.id}">
    <div style="display:flex;gap:8px">
      <span class="pstrip" style="background:${PHASE_C[w.phase] || 'var(--faint)'}"></span>
      <div style="min-width:0;flex:1">
        <div class="kt">${esc(w.title)}</div>
        <div class="kmeta" style="margin-top:5px">
          <span class="chip mono">${esc(w.act)}</span>
          <span class="chip">${esc(w.pilotShort)}</span>
          ${w.gate ? `<span class="badge b-v">${esc(w.gate)}</span>` : ''}
          ${w.blocker ? '<span class="badge b-r">Blocked</span>' : ''}
        </div>
      </div>
    </div>
    ${w.pct > 0 && w.pct < 100 ? bar(w.pct) : ''}
    <div class="kfoot">
      <span class="who">${w.owner ? `<span class="av">${esc(initials(w.owner))}</span>
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(w.owner)}</span>`
        : '<span class="src">Unassigned</span>'}</span>
      <span class="due ${dc}">${esc(fmtD(w.due))}</span>
    </div>
  </article>`;
}

/* ── card detail drawer ─────────────────────────────────────────── */
function openCard(id) {
  const w = getWork(id);
  if (!w) return;
  const p = D.pilots.find(x => x.id === w.pilot);
  drawer(`${w.act} · ${p ? p.short : w.pilot}`, w.title, `
    <div class="grid g2">
      <div><span class="lbl">Status</span>
        <select data-w="${id}" data-wf="status">${opts(STATUSES.map(s => [s.k, s.t]), w.status)}</select></div>
      <div><span class="lbl">Owner</span>
        <input type="text" data-w="${id}" data-wf="owner" value="${esc(w.owner)}" placeholder="Name"></div>
      <div><span class="lbl">Due</span>
        <input type="date" data-w="${id}" data-wf="due" value="${esc(w.due)}"></div>
      <div><span class="lbl">Percent complete</span>
        <input type="number" min="0" max="100" step="5" data-w="${id}" data-wf="pct" value="${w.pct}"></div>
      <div><span class="lbl">Planned start week</span>
        <input type="number" min="1" max="${D.meta.weeks}" data-w="${id}" data-wf="startWk" value="${w.startWk}"></div>
      <div><span class="lbl">Planned end week</span>
        <input type="number" min="1" max="${D.meta.weeks}" data-w="${id}" data-wf="endWk" value="${w.endWk}"></div>
    </div>
    <div><span class="lbl">Blocker — shows on the board and the Friday report</span>
      <textarea data-w="${id}" data-wf="blocker" placeholder="What is stopping this, and who can unblock it.">${esc(w.blocker)}</textarea></div>
    <div><span class="lbl">Notes</span>
      <textarea data-w="${id}" data-wf="notes" placeholder="Progress notes, decisions, links.">${esc(w.notes)}</textarea></div>
    <div class="card"><div class="body tight">
      <div class="src" style="display:grid;gap:4px">
        <div><strong style="color:var(--ink)">Accountable role</strong> — ${esc(w.role)}</div>
        <div><strong style="color:var(--ink)">Expected output</strong> — ${esc(w.output)}</div>
        <div><strong style="color:var(--ink)">Phase</strong> — ${esc(w.phase)}${w.gate ? ' · gate: ' + esc(w.gate) : ''}</div>
        <div><strong style="color:var(--ink)">Workplan reference</strong> — ${esc(w.act)}, planned ${weekLabel(w.startWk)}–${weekLabel(w.endWk)}</div>
      </div>
    </div></div>
  `);
}
/* ══ 3 · TIMELINE & MILESTONES ═════════════════════════════════════ */
let TLMode = 'pilot';   // 'pilot' | 'phase' | 'deliv'

function renderTimeline() {
  const el = $('#panel-timeline');
  const W = D.meta.weeks, wk = currentWeek();
  const ms = D.milestones.slice().sort((a, b) => a.week - b.week);

  const head = `<tr><th class="nm">${TLMode === 'pilot' ? 'Pilot' : TLMode === 'phase' ? 'Lifecycle phase' : 'Deliverable'}</th>
    ${Array.from({ length: W }, (_, i) => `<th class="wk"${i + 1 === wk ? ' style="color:var(--green)"' : ''}>W${i + 1}</th>`).join('')}</tr>`;

  const cells = (bars, msList) => Array.from({ length: W }, (_, i) => {
    const n = i + 1;
    const b = bars.find(x => x.s === n);
    const mk = (msList || []).filter(m => m.week === n);
    return `<td class="gcell${n === wk ? ' now' : ''}">
      ${b ? `<div class="gbar ${b.cls}" style="left:2px;width:calc(${(b.e - b.s + 1) * 100}% + ${(b.e - b.s) * 1}px - 4px)"
        title="${esc(b.title)}">${esc(b.label || '')}</div>` : ''}
      ${mk.map((m, j) => {
        // two milestones can share a week — fan them out instead of stacking
        const off = mk.length === 1 ? 0 : (j - (mk.length - 1) / 2) * 13;
        return `<div class="gms ${m.status === 'done' ? 'done' : m.week < wk ? 'risk' : m.week === wk ? 'a' : ''}"
          style="left:calc(50% - 10px + ${off}px)" title="${esc(m.id + ' · ' + m.name)}"
          data-openms="${m.id}"></div>`;
      }).join('')}
    </td>`;
  }).join('');

  let rows = '';
  if (TLMode === 'pilot') {
    rows = D.pilots.map(p => {
      const pr = pilotProgress(p.id);
      const cls = p.rag === 'R' ? 'r' : p.rag === 'A' ? 'a' : p.rag === 'G' ? '' : 'n';
      return `<tr><td class="nm" data-openpilot="${p.id}" style="cursor:pointer">
          <div style="display:flex;gap:7px;align-items:center">
            <span class="rag ${p.rag}"></span>
            <div style="min-width:0"><div style="font-weight:600;font-size:12px">${esc(p.short)}</div>
              <div class="src mono">${p.id} · ${pr.pct}%</div></div>
          </div></td>
        ${cells([{ s: p.startWeek, e: p.endWeek, cls, label: pr.pct + '%', title: p.name }], [])}</tr>`;
    }).join('');
  } else if (TLMode === 'phase') {
    rows = PHASES.map(ph => {
      const acts = D.activityTemplate.filter(a => a.phase === ph);
      const s = Math.min(...acts.map(a => a.startWk)), e = Math.max(...acts.map(a => a.endWk));
      const items = allWork().filter(w => w.phase === ph);
      const pct = Math.round(items.filter(w => w.status === 'done').length / items.length * 100);
      return `<tr><td class="nm"><div style="display:flex;gap:7px;align-items:center">
          <span class="pstrip" style="background:${PHASE_C[ph]};height:22px;width:3px"></span>
          <div><div style="font-weight:600;font-size:12px">${esc(ph)}</div>
            <div class="src mono">${acts.length} activities · ${pct}%</div></div></div></td>
        ${cells([{ s, e, cls: pct === 100 ? '' : 'b', label: pct + '%', title: ph }], [])}</tr>`;
    }).join('');
  } else {
    rows = D.deliverables.map(d => `<tr><td class="nm" data-opendeliv="${d.id}" style="cursor:pointer">
        <div style="display:flex;gap:7px;align-items:center"><span class="rag ${d.rag}"></span>
        <div style="min-width:0"><div style="font-weight:600;font-size:12px">${esc(d.id)} · ${esc(d.name)}</div>
          <div class="src mono">due ${weekLabel(d.dueWeek)} · ${d.pct}%</div></div></div></td>
      ${cells([{ s: 1, e: d.dueWeek, cls: d.rag === 'R' ? 'r' : d.rag === 'A' ? 'a' : d.rag === 'G' ? '' : 'n', label: d.pct + '%', title: d.name }], [])}</tr>`).join('');
  }

  el.innerHTML = `<div class="stack">
    <div class="card noprint"><div class="body tight"><div class="row">
      <div class="seg">${[['pilot', 'By pilot'], ['phase', 'By phase'], ['deliv', 'By deliverable']]
        .map(([k, l]) => `<button type="button" data-tl="${k}" aria-pressed="${TLMode === k}">${l}</button>`).join('')}</div>
      <span class="spacer"></span>
      <span class="legend">
        <span><i style="background:var(--green)"></i>On track</span>
        <span><i style="background:var(--amber)"></i>At risk</span>
        <span><i style="background:var(--rose)"></i>Off track</span>
        <span><span class="gms" style="position:relative;display:inline-block;width:13px;height:13px;top:2px;margin-right:5px"></span>Milestone</span>
      </span>
    </div></div></div>

    <div class="card"><header><h2>Wave 1 · ${D.meta.weeks}-week plan</h2>
      <span class="hint">Week ${wk} of ${D.meta.weeks} · ${fmtD(weekStart(1))} to ${fmtD(weekEnd(D.meta.weeks))}</span></header>
      <div class="gt"><table><thead>${head}</thead>
        <tbody><tr><td class="nm" style="font-weight:700;font-size:11px;letter-spacing:.08em;
            text-transform:uppercase;color:var(--faint);background:var(--surface-2)">Milestones</td>
          ${cells([], ms)}</tr>${rows}</tbody></table></div>
    </div>

    <div class="card">
      <header><h2>Milestones</h2><span class="hint">click to edit · ${ms.filter(m => m.status === 'done').length} of ${ms.length} met</span></header>
      <div class="tscroll"><table>
        <thead><tr><th style="width:52px">ID</th><th>Milestone</th><th style="width:64px">Week</th>
          <th>Owner</th><th>Acceptance</th><th style="width:110px">Status</th><th style="width:104px">RAG</th></tr></thead>
        <tbody>${ms.map(m => `<tr>
          <td class="mono" style="font-weight:700">${m.id}</td>
          <td><div style="font-weight:600">${esc(m.name)}</div>
            ${m.evidence ? `<div class="src">Evidence: ${esc(m.evidence)}</div>` : ''}</td>
          <td class="mono">${weekLabel(m.week)}<div class="src">${fmtD(weekEnd(m.week))}</div></td>
          <td style="font-size:11.5px">${esc(m.owner)}</td>
          <td class="src" style="max-width:330px">${esc(m.desc)}</td>
          <td><select data-ms="${m.id}" data-msf="status">${opts([['planned', 'Planned'], ['progress', 'In progress'], ['done', 'Met'], ['missed', 'Missed']], m.status)}</select></td>
          <td>${ragSeg('msrag', m.id, m.rag)}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>
  </div>`;
}

/* ══ 4 · CALENDAR ══════════════════════════════════════════════════ */
let CalCur = null;           // first of the displayed month
const CATS = {
  gov: ['Governance', 'var(--green)'], pilot: ['Pilot session', 'var(--blue)'],
  change: ['Change & comms', 'var(--violet)'], training: ['Training', 'var(--amber)'],
  tooling: ['Tooling', 'var(--teal)'], tom: ['TOM / review', 'var(--rose)'],
  other: ['Other', 'var(--faint)'],
};
let CalFilter = '';

function renderCalendar() {
  const el = $('#panel-calendar');
  if (!CalCur) {
    const t = parse(todayISO()), s = parse(D.meta.start);
    const base = (t >= s && t <= parse(weekEnd(D.meta.weeks))) ? t : s;
    CalCur = new Date(base.getFullYear(), base.getMonth(), 1);
  }
  const y = CalCur.getFullYear(), mo = CalCur.getMonth();
  const first = new Date(y, mo, 1);
  const startOff = (first.getDay() + 6) % 7;             // Monday-first
  const gridStart = new Date(y, mo, 1 - startOff);
  const monthName = first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

  const evs = CalFilter ? D.events.filter(e => e.cat === CalFilter) : D.events;
  const byDate = {};
  for (const e of evs) (byDate[e.date] = byDate[e.date] || []).push(e);
  for (const k in byDate) byDate[k].sort((a, b) => (a.start || '').localeCompare(b.start || ''));
  const msByDate = {};
  for (const m of D.milestones) {
    const dt = m.date || weekEnd(m.week);
    (msByDate[dt] = msByDate[dt] || []).push(m);
  }

  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart); d.setDate(gridStart.getDate() + i);
    const ds = iso(d), out = d.getMonth() !== mo, wknd = d.getDay() === 0 || d.getDay() === 6;
    const wn = weekOf(ds);
    const day = (byDate[ds] || []), mss = (msByDate[ds] || []);
    cells += `<div class="cell${out ? ' out' : ''}${wknd ? ' wk' : ''}${ds === todayISO() ? ' today' : ''}" data-day="${ds}">
      <div class="dn"><span>${d.getDate()}</span>
        ${!out && wn >= 1 && wn <= D.meta.weeks && d.getDay() === 1 ? `<span class="chip mono">W${wn}</span>` : ''}</div>
      ${mss.map(m => `<div class="ev ms" data-openms="${m.id}" title="${esc(m.name)}">◆ ${esc(m.id)} ${esc(m.name)}</div>`).join('')}
      ${day.slice(0, 4).map(e => `<div class="ev" data-openev="${e.id}"
        style="border-left-color:${(CATS[e.cat] || CATS.other)[1]};${e.done ? 'opacity:.5;text-decoration:line-through' : ''}"
        title="${esc(e.title + ' · ' + (e.owner || ''))}">
        <span class="et">${esc(e.start || '')}</span>${esc(e.title)}</div>`).join('')}
      ${day.length > 4 ? `<div class="src" style="padding-left:4px">+${day.length - 4} more</div>` : ''}
    </div>`;
  }

  el.innerHTML = `<div class="stack">
    <div class="card noprint"><div class="body tight"><div class="row">
      <button class="btn sm" id="calPrev">‹</button>
      <strong style="min-width:170px;text-align:center;font-size:14px">${esc(monthName)}</strong>
      <button class="btn sm" id="calNext">›</button>
      <button class="btn sm" id="calToday">Today</button>
      <span class="spacer"></span>
      <div style="min-width:165px"><select id="calFilter">${opts(
        [['', 'All session types']].concat(Object.entries(CATS).map(([k, v]) => [k, v[0]])), CalFilter)}</select></div>
      <button class="btn sm primary" id="addEvent">＋ Add session</button>
    </div></div></div>

    <div class="cal">
      ${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="dow">${d}</div>`).join('')}
      ${cells}
    </div>

    <div class="card"><div class="body tight"><div class="legend">
      ${Object.entries(CATS).map(([k, v]) => `<span><i style="background:${v[1]}"></i>${esc(v[0])}</span>`).join('')}
      <span><i style="background:var(--green);border-radius:2px;transform:rotate(45deg)"></i>Milestone</span>
      <span class="spacer"></span>
      <span class="src">${D.events.length} sessions scheduled across the wave.</span>
    </div></div></div>
  </div>`;
}

/* ══ 5 · PILOT MANAGEMENT ══════════════════════════════════════════

let selPilot = null;
let pilotTab = 'progress';

          font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.projectName)}</span>` : ''}

    </div>

    <div class="stack">
      <div class="card">
        <header>
          <div style="min-width:0">
            <div class="src mono">${p.id} · ${esc(p.jiraKey)}${p.jiraRef ? ' · ' + esc(p.jiraRef) : ''} · ${esc(p.type)}</div>
            <h2 style="font-size:17px;margin-top:2px">${esc(p.name)}</h2>
            ${p.projectName ? `<div style="font-size:13px;font-weight:600;color:var(--green);margin-top:2px">
              ${esc(p.projectName)}${p.swf ? `<span class="src" style="font-weight:400"> · delivered with ${esc(p.swf)}</span>` : ''}</div>` : ''}
          </div>
          <div class="row">

        </header>
        <div class="body">
          <div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(128px,1fr))">

function pilotProgressPane(p, items, blocked, evs) {
  const byPhase = PHASES.map(ph => {
    const set = items.filter(w => w.phase === ph);
    const done = set.filter(w => w.status === 'done').length;
    return { ph, total: set.length, done, pct: set.length ? Math.round(done / set.length * 100) : 0 };
  });
  const upcoming = evs.filter(e => e.date >= todayISO()).slice(0, 6);
  return `<div class="grid g2" style="align-items:start">
    <div class="card"><header><h3>Progress by lifecycle phase</h3></header>
      <div class="body tight">${byPhase.map(b => `<div style="padding:8px 0;border-bottom:1px solid var(--line-soft)">
        <div class="row" style="justify-content:space-between;margin-bottom:5px">
          <span style="display:flex;gap:7px;align-items:center;font-size:12.5px;font-weight:600">
            <span class="pstrip" style="background:${PHASE_C[b.ph]};height:13px;width:3px"></span>${esc(b.ph)}</span>
          <span class="mono src">${b.done}/${b.total}</span></div>
        ${bar(b.pct)}</div>`).join('')}</div></div>

    <div class="stack">
      ${blocked.length ? `<div class="card"><header><h3>Blocked</h3>
        <span class="badge b-r">${blocked.length}</span></header>
        <div class="body tight">${blocked.map(w => `<div style="padding:7px 0;border-bottom:1px solid var(--line-soft);cursor:pointer" data-card="${w.id}">
          <div style="font-size:12.5px;font-weight:600">${esc(w.title)}</div>
          <div class="src">${esc(w.act)}${w.blocker ? ' · ' + esc(w.blocker) : ' · no blocker recorded'}</div>
        </div>`).join('')}</div></div>` : ''}

      <div class="card"><header><h3>Upcoming sessions</h3>
        <button class="btn sm" data-go="calendar">Calendar</button></header>
        <div class="body tight">${upcoming.length ? upcoming.map(e => `
          <div style="display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--line-soft);cursor:pointer" data-openev="${e.id}">
            <span class="chip mono" style="flex:none">${esc(fmtD(e.date))}</span>
            <div style="min-width:0"><div style="font-size:12.5px;font-weight:600">${esc(e.title)}</div>
              <div class="src">${esc(e.start)}–${esc(e.end)} · ${esc(e.owner)}</div></div>
          </div>`).join('') : '<p class="src" style="margin:0">No sessions scheduled for this pilot.</p>'}</div></div>

      <div class="card"><header><h3>Success criteria</h3>
        <span class="hint">${p.successCriteria.filter(c => c.met).length} of ${p.successCriteria.length} met</span></header>
        <div class="body tight">${p.successCriteria.map((c, i) => `
          <div style="display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line-soft)">

            <input type="text" data-scx="${p.id}" data-sci="${i}" value="${esc(c.t)}" style="border:0;background:transparent;padding:2px 0">
          </div>`).join('')}
          <button class="btn sm" data-addsc="${p.id}" style="margin-top:9px">＋ Add criterion</button></div></div>
    </div>
  </div>`;
}

function pilotTeamPane(p) {

    <div style="margin-top:12px"><span class="lbl">Blockers and escalations</span>
